<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Mídia Performance & Pacing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDb1jyTxZCVsRltoV8cgNCH7oU24ypQx2U",
            authDomain: "dashboard-pacing.firebaseapp.com",
            projectId: "dashboard-pacing",
            storageBucket: "dashboard-pacing.firebasestorage.app",
            messagingSenderId: "116688559377",
            appId: "1:116688559377:web:cb8b0a1e9450d23e9280b0",
            measurementId: "G-XPFMY99N"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            switch(name) {
                case 'layout': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
                case 'trending': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
                case 'dollar': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
                case 'calendar': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
                case 'sparkles': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
                case 'download': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
                case 'share': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>;
                case 'plus': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
                case 'trash': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
                case 'git-compare': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>;
                case 'pie-chart': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
                default: return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>;
            }
        };

        const PRODUCTS = [
            "Pós-Graduação",
            "Pós-Híbridas",
            "Pós-Médica",
            "Pós-Injetáveis",
            "Técnico",
            "Técnico-Híbrido",
            "THE - Técnico em Enfermagem",
            "THP - Técnico em Podologia",
            "THR - Técnico em Radiologia",
            "THS - Técnico em Segurança do Trabalho",
            "Profissionalizantes"
        ];

        const MONTHS_LIST = [
            { id: "2026-01", name: "Janeiro 2026" },
            { id: "2026-02", name: "Fevereiro 2026" },
            { id: "2026-03", name: "Março 2026" },
            { id: "2026-04", name: "Abril 2026" },
            { id: "2026-05", name: "Maio 2026" },
            { id: "2026-06", name: "Junho 2026" },
            { id: "2026-07", name: "Julho 2026" },
            { id: "2026-08", name: "Agosto 2026" },
            { id: "2026-09", name: "Setembro 2026" },
            { id: "2026-10", name: "Outubro 2026" },
            { id: "2026-11", name: "Novembro 2026" },
            { id: "2026-12", name: "Dezembro 2026" }
        ];

        function App() {
            const currentMonthDefault = (() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            })();

            const [selectedMonth, setSelectedMonth] = useState(currentMonthDefault);
            const [activeTab, setActiveTab] = useState("overview");
            const [selectedProduct, setSelectedProduct] = useState("Pós-Graduação");
            const [selectedTool, setSelectedTool] = useState("Todas");

            const [budgetsByMonth, setBudgetsByMonth] = useState({
                [currentMonthDefault]: {
                    "Pós-Graduação": 50000,
                    "Pós-Híbridas": 35000,
                    "Pós-Médica": 30000,
                    "Pós-Injetáveis": 30000,
                    "Técnico": 40000,
                    "Técnico-Híbrido": 25000,
                    "THE - Técnico em Enfermagem": 20000,
                    "THP - Técnico em Podologia": 15000,
                    "THR - Técnico em Radiologia": 15000,
                    "THS - Técnico em Segurança do Trabalho": 15000,
                    "Profissionalizantes": 20000
                }
            });

            const [campaigns, setCampaigns] = useState([
                { id: 1, name: "Google Search - Institucional", product: "Pós-Graduação", tool: "Google Ads", status: "Ativa", dailyData: {} },
                { id: 2, name: "Meta Ads - Conversão Leads", product: "Pós-Graduação", tool: "Meta Ads", status: "Ativa", dailyData: {} },
                { id: 3, name: "Google PMax - Pós Híbrida", product: "Pós-Híbridas", tool: "Google Ads", status: "Ativa", dailyData: {} }
            ]);

            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            const [aiText, setAiText] = useState("");
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [syncStatus, setSyncStatus] = useState("A carregar nuvem...");
            const [campaignPacingModal, setCampaignPacingModal] = useState(null);

            const [compareMonthA, setCompareMonthA] = useState(currentMonthDefault);
            const [compareMonthB, setCompareMonthB] = useState(currentMonthDefault);

            const daysInMonth = useMemo(() => {
                const [year, month] = selectedMonth.split('-').map(Number);
                const totalDays = new Date(year, month, 0).getDate();
                const days = [];
                const weekdays = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
                const now = new Date();

                for (let i = 1; i <= totalDays; i++) {
                    const d = new Date(year, month - 1, i);
                    days.push({
                        dateNum: i,
                        dateStr: `${String(i).padStart(2, '0')}/${String(month).padStart(2, '0')}`,
                        weekday: weekdays[d.getDay()],
                        isPast: d < new Date(now.getFullYear(), now.getMonth(), now.getDate()),
                        isToday: d.toDateString() === now.toDateString()
                    });
                }
                return days;
            }, [selectedMonth]);

            useEffect(() => {
                if (!window.db) return;
                const docRef = window.db.collection("dash_data").doc("main_state_multi_month");
                
                const unsubscribe = docRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (data.budgetsByMonth) setBudgetsByMonth(prev => ({ ...prev, ...data.budgetsByMonth }));
                        if (data.campaigns) setCampaigns(data.campaigns);
                        setSyncStatus("Sincronizado com a nuvem");
                    } else {
                        docRef.set({ budgetsByMonth, campaigns });
                        setSyncStatus("Sincronizado com a nuvem");
                    }
                }, (error) => {
                    console.error("Erro ao sincronizar:", error);
                    setSyncStatus("Modo local (Offline)");
                });

                return () => unsubscribe();
            }, []);

            const saveDataToCloud = (newBudgets, newCampaigns) => {
                setBudgetsByMonth(newBudgets);
                setCampaigns(newCampaigns);

                if (window.db) {
                    setSyncStatus("A guardar...");
                    window.db.collection("dash_data").doc("main_state_multi_month").set({
                        budgetsByMonth: newBudgets,
                        campaigns: newCampaigns
                    }).then(() => {
                        setSyncStatus("Sincronizado com a nuvem");
                    }).catch(() => {
                        setSyncStatus("Erro ao guardar");
                    });
                }
            };

            const formatBRL = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);

            const currentMonthBudgets = useMemo(() => {
                return budgetsByMonth[selectedMonth] || {
                    "Pós-Graduação": 50000,
                    "Pós-Híbridas": 35000,
                    "Pós-Médica": 30000,
                    "Pós-Injetáveis": 30000,
                    "Técnico": 40000,
                    "Técnico-Híbrido": 25000,
                    "THE - Técnico em Enfermagem": 20000,
                    "THP - Técnico em Podologia": 15000,
                    "THR - Técnico em Radiologia": 15000,
                    "THS - Técnico em Segurança do Trabalho": 15000,
                    "Profissionalizantes": 20000
                };
            }, [budgetsByMonth, selectedMonth]);

            const totalSpentByProduct = useMemo(() => {
                const map = {};
                PRODUCTS.forEach(prod => {
                    let total = 0;
                    campaigns.filter(c => c.product === prod && c.status === "Ativa" && (selectedTool === "Todas" || c.tool === selectedTool)).forEach(c => {
                        if (c.dailyData && c.dailyData[selectedMonth]) {
                            Object.values(c.dailyData[selectedMonth]).forEach(d => {
                                total += Number(d.realized) || 0;
                            });
                        }
                    });
                    map[prod] = total;
                });
                return map;
            }, [campaigns, selectedMonth, selectedTool]);

            // Estatísticas consolidadas globais para o Overview
            const overviewGlobalStats = useMemo(() => {
                let totalBudget = 0;
                let totalSpent = 0;
                let googleSpent = 0;
                let metaSpent = 0;

                PRODUCTS.forEach(p => {
                    totalBudget += Number(currentMonthBudgets[p]) || 0;
                });

                campaigns.forEach(c => {
                    if (c.status === "Ativa" && c.dailyData && c.dailyData[selectedMonth]) {
                        Object.values(c.dailyData[selectedMonth]).forEach(d => {
                            const val = Number(d.realized) || 0;
                            totalSpent += val;
                            if (c.tool === "Google Ads") googleSpent += val;
                            if (c.tool === "Meta Ads") metaSpent += val;
                        });
                    }
                });

                const totalPct = totalBudget > 0 ? Math.min(Math.round((totalSpent / totalBudget) * 100), 100) : 0;
                const totalBalance = totalBudget - totalSpent;
                const googlePct = totalSpent > 0 ? Math.round((googleSpent / totalSpent) * 100) : 0;
                const metaPct = totalSpent > 0 ? Math.round((metaSpent / totalSpent) * 100) : 0;

                return { totalBudget, totalSpent, totalPct, totalBalance, googleSpent, metaSpent, googlePct, metaPct };
            }, [currentMonthBudgets, campaigns, selectedMonth]);

            const pacingRows = useMemo(() => {
                const prodBudget = currentMonthBudgets[selectedProduct] || 0;
                const totalDays = daysInMonth.length;
                const defaultDaily = prodBudget / totalDays;

                let accumulated = 0;
                return daysInMonth.map((day) => {
                    let dayPlanned = 0;
                    let dayRealized = 0;
                    let hasCampaignData = false;

                    campaigns
                        .filter(c => c.product === selectedProduct && c.status === "Ativa" && (selectedTool === "Todas" || c.tool === selectedTool))
                        .forEach(c => {
                            if (c.dailyData && c.dailyData[selectedMonth] && c.dailyData[selectedMonth][day.dateStr]) {
                                hasCampaignData = true;
                                dayPlanned += Number(c.dailyData[selectedMonth][day.dateStr].planned) || 0;
                                dayRealized += Number(c.dailyData[selectedMonth][day.dateStr].realized) || 0;
                            }
                        });

                    const planned = hasCampaignData ? dayPlanned : defaultDaily;
                    const realized = dayRealized;

                    accumulated += realized;
                    const balance = prodBudget - accumulated;
                    const delta = realized - planned;

                    let status = "Dentro do Pacing";
                    if (realized > planned * 1.1) status = "Overbudget";
                    else if (realized < planned * 0.9 && day.isPast) status = "Underbudget";

                    return { ...day, planned, realized, delta, accumulated, balance, status };
                });
            }, [selectedProduct, currentMonthBudgets, daysInMonth, campaigns, selectedMonth, selectedTool]);

            const currentKPIs = useMemo(() => {
                const budget = currentMonthBudgets[selectedProduct] || 0;
                const totalRealized = pacingRows.reduce((acc, r) => acc + r.realized, 0);
                const balance = budget - totalRealized;
                const pastDays = pacingRows.filter(r => r.isPast);
                const lastPast = pastDays[pastDays.length - 1] || pacingRows[0];
                const futureDaysCount = pacingRows.filter(r => !r.isPast && !r.isToday).length || 1;
                const suggestedPacing = balance > 0 ? balance / futureDaysCount : 0;

                return {
                    budget,
                    totalRealized,
                    balance,
                    lastDayRealized: lastPast?.realized || 0,
                    lastDayStatus: lastPast?.status || "Normal",
                    suggestedPacing
                };
            }, [selectedProduct, currentMonthBudgets, pacingRows]);

            const getMonthSpentTotal = (monthKey) => {
                let total = 0;
                campaigns.forEach(c => {
                    if (c.dailyData && c.dailyData[monthKey]) {
                        Object.values(c.dailyData[monthKey]).forEach(d => {
                            total += Number(d.realized) || 0;
                        });
                    }
                });
                return total;
            };

            const getMonthBudgetTotal = (monthKey) => {
                const mBudgets = budgetsByMonth[monthKey] || {};
                return PRODUCTS.reduce((acc, p) => acc + (Number(mBudgets[p]) || 0), 0);
            };

            const handleExportCSV = () => {
                let csv = "Tipo,Mes,Produto,Ferramenta,Valor\n";
                Object.keys(budgetsByMonth).forEach(m => {
                    PRODUCTS.forEach(p => csv += `Orcamento,${m},${p},Geral,${budgetsByMonth[m][p] || 0}\n`);
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_orcamentos_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            };

            const handleOpenAI = () => {
                setIsAiModalOpen(true);
                setAiText("A analisar métricas de performance e pacing com Inteligência Artificial...");
                setTimeout(() => {
                    setAiText(`📊 Relatório de IA (${selectedProduct} - ${selectedMonth}):\n\nO orçamento mensal de ${formatBRL(currentKPIs.budget)} está com consumo acumulado de ${formatBRL(currentKPIs.totalRealized)}. O saldo restante é de ${formatBRL(currentKPIs.balance)}.\n\nRecomendação: O pacing sugerido para os próximos dias é de ${formatBRL(currentKPIs.suggestedPacing)}/dia. Mantenha o monitoramento ativo nas campanhas de maior conversão para evitar desvios no orçamento BAU.`);
                }, 1000);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6">
                    <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3 w-full md:w-auto">
                            <div className="bg-indigo-50 p-2.5 rounded-xl text-indigo-600">
                                <Icon name="calendar" className="w-5 h-5" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Mês de Referência</label>
                                <select 
                                    value={selectedMonth}
                                    onChange={(e) => setSelectedMonth(e.target.value)}
                                    className="bg-transparent font-bold text-slate-900 text-base focus:outline-none cursor-pointer"
                                >
                                    {MONTHS_LIST.map(m => (
                                        <option key={m.id} value={m.id}>{m.name}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                            <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5 shadow-sm">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                {syncStatus}
                            </span>
                            <button onClick={handleOpenAI} className="flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition">
                                <Icon name="sparkles" className="w-4 h-4" /> Resumo IA
                            </button>
                            <button onClick={() => setIsShareModalOpen(true)} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition">
                                <Icon name="share" className="w-4 h-4" /> Partilhar Link
                            </button>
                        </div>
                    </div>

                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-slate-200 pb-6">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900">
                                Gestão de Mídia Performance & Pacing
                            </h1>
                            <p className="text-slate-500 text-sm mt-1">Controle de BAU, Pacing Diário por Campanha e Comparativos (Google & Meta Ads)</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleExportCSV} className="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium border border-slate-300 shadow-sm transition">
                                <Icon name="download" className="w-4 h-4" /> Exportar Backup
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-wrap gap-2 mb-6 bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                        <button
                            onClick={() => setActiveTab("overview")}
                            className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "overview" ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                        >
                            📊 Visão Geral (Executiva)
                        </button>
                        {PRODUCTS.map(prod => (
                            <button
                                key={prod}
                                onClick={() => { setSelectedProduct(prod); setActiveTab("pacing"); }}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab !== "overview" && activeTab !== "comparison" && selectedProduct === prod ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                            >
                                {prod}
                            </button>
                        ))}
                        <button
                            onClick={() => setActiveTab("comparison")}
                            className={`px-4 py-2 rounded-lg text-sm font-semibold transition ml-auto flex items-center gap-1.5 ${activeTab === "comparison" ? 'bg-emerald-600 text-white shadow' : 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100'}`}
                        >
                            <Icon name="git-compare" className="w-4 h-4" /> Comparativo Meses
                        </button>
                    </div>

                    {activeTab !== "comparison" && activeTab !== "overview" && (
                        <div className="flex justify-between items-center mb-6 bg-white px-4 py-3 rounded-xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Canal:</span>
                                {["Todas", "Google Ads", "Meta Ads"].map(tool => (
                                    <button
                                        key={tool}
                                        onClick={() => setSelectedTool(tool)}
                                        className={`px-3 py-1 rounded-md text-xs font-medium transition ${selectedTool === tool ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        {tool}
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab("pacing")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'pacing' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    📅 Pacing Diário
                                </button>
                                <button onClick={() => setActiveTab("campaigns")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'campaigns' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    🚀 Campanhas
                                </button>
                                <button onClick={() => setActiveTab("reports")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'reports' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    📈 Relatórios & Gráficos
                                </button>
                            </div>
                        </div>
                    )}

                    {/* VISÃO GERAL - PAINEL EXECUTIVO AVANÇADO */}
                    {activeTab === "overview" && (
                        <div className="space-y-6">
                            {/* KPI CARDS GLOBAIS */}
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Orçamento Total Global</span>
                                    <p className="text-2xl font-bold text-slate-900 mt-2">{formatBRL(overviewGlobalStats.totalBudget)}</p>
                                    <p className="text-xs text-slate-500 mt-1">Soma de todos os produtos do mês</p>

                                                            />
                                                        </td>
                                                        <td className="px-3 py-2">
                                                            <input 
                                                                type="number"
                                                                value={currentDaily.realized}
                                                                placeholder="0"
                                                                onChange={(e) => {
                                                                    const val = e.target.value;
                                                                    const updatedMonthDaily = { ...monthDaily, [day.dateStr]: { ...currentDaily, realized: val } };
                                                                    const updatedDailyData = { ...(campaignPacingModal.dailyData || {}), [selectedMonth]: updatedMonthDaily };
                                                                    setCampaignPacingModal({ ...campaignPacingModal, dailyData: updatedDailyData });
                                                                }}
                                                                className="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-28 text-slate-900 font-semibold text-emerald-600"
                                                            />
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="mt-4 pt-3 border-t border-slate-100 flex gap-3">
                                    <button 
                                        onClick={() => {
                                            const updatedCampaigns = campaigns.map(c => c.id === campaignPacingModal.id ? campaignPacingModal : c);
                                            saveDataToCloud(budgetsByMonth, updatedCampaigns);
                                            setCampaignPacingModal(null);
                                        }}
                                        className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-medium transition shadow"
                                    >
                                        Guardar e Atualizar Pacing
                                    </button>
                                    <button onClick={() => setCampaignPacingModal(null)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-medium transition">
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        <Icon name="sparkles" className="text-purple-600" /> Analista de Mídia IA
                                    </h3>
                                    <button onClick={() => setIsAiModalOpen(false)} className="text-slate-400 hover:text-slate-700">✕</button>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-700 text-sm whitespace-pre-line leading-relaxed">
                                    {aiText}
                                </div>
                                <button onClick={() => setIsAiModalOpen(false)} className="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-medium transition shadow">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {isShareModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">Partilhar Dashboard</h3>
                                <p className="text-sm text-slate-500 mb-4">Copie o link abaixo para aceder ao painel publicado:</p>
                                <input 
                                    type="text" 
                                    readOnly 
                                    value={window.location.href}
                                    onClick={(e) => e.target.select()}
                                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 text-sm mb-4 select-all"
                                />
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            navigator.clipboard.writeText(window.location.href);
                                            alert("Link copiado para a área de transferência!");
                                        }}
                                        className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-medium transition shadow"
                                    >
                                        Copiar Link
                                    </button>
                                    <button onClick={() => setIsShareModalOpen(false)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-medium transition">
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
