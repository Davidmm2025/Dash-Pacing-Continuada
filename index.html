<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Mídia Performance & Pacing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script>
        // Configuração do Firebase com as suas chaves
        const firebaseConfig = {
            apiKey: "AIzaSyDb1jyTxZCVsRltoV8cgNCH7oU24ypQx2U",
            authDomain: "dashboard-pacing.firebaseapp.com",
            projectId: "dashboard-pacing",
            storageBucket: "dashboard-pacing.firebasestorage.app",
            messagingSenderId: "116688559377",
            appId: "1:116688559377:web:cb8b0a1e9450d23e9280b0",
            measurementId: "G-XPFMY99N"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            switch(name) {
                case 'layout': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
                case 'trending': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
                case 'dollar': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
                case 'calendar': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
                case 'sparkles': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
                case 'download': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
                case 'share': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>;
                case 'plus': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
                case 'trash': return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
                default: return <svg className={className} {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>;
            }
        };

        const PRODUCTS = [
            "Pós-graduação",
            "Pós-híbrida",
            "Técnicos",
            "Técnicos Híbridos",
            "Profissionalizantes"
        ];

        function App() {
            const [activeTab, setActiveTab] = useState("overview");
            const [selectedProduct, setSelectedProduct] = useState("Pós-graduação");
            const [selectedTool, setSelectedTool] = useState("Todas");

            const [budgets, setBudgets] = useState({
                "Pós-graduação": 50000,
                "Pós-híbrida": 35000,
                "Técnicos": 40000,
                "Técnicos Híbridos": 25000,
                "Profissionalizantes": 20000
            });

            const [campaigns, setCampaigns] = useState([
                { id: 1, name: "Google Search - Institucional", product: "Pós-graduação", tool: "Google Ads", plannedDaily: 800, yesterdayRealized: 850, status: "Ativa" },
                { id: 2, name: "Meta Ads - Conversão Leads", product: "Pós-graduação", tool: "Meta Ads", plannedDaily: 600, yesterdayRealized: 580, status: "Ativa" },
                { id: 3, name: "Google PMax - Pós Híbrida", product: "Pós-híbrida", tool: "Google Ads", plannedDaily: 700, yesterdayRealized: 720, status: "Ativa" }
            ]);

            const [manualPacing, setManualPacing] = useState({});
            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            const [aiText, setAiText] = useState("");
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [syncStatus, setSyncStatus] = useState("A carregar nuvem...");

            // Sincronização em tempo real com o Firestore
            useEffect(() => {
                if (!window.db) return;
                const docRef = window.db.collection("dash_data").doc("main_state");
                
                const unsubscribe = docRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (data.budgets) setBudgets(data.budgets);
                        if (data.campaigns) setCampaigns(data.campaigns);
                        if (data.manualPacing) setManualPacing(data.manualPacing);
                        setSyncStatus("Sincronizado com a nuvem");
                    } else {
                        // Criar documento inicial se não existir
                        docRef.set({ budgets, campaigns, manualPacing });
                        setSyncStatus("Sincronizado com a nuvem");
                    }
                }, (error) => {
                    console.error("Erro ao sincronizar:", error);
                    setSyncStatus("Modo local (Offline)");
                });

                return () => unsubscribe();
            }, []);

            // Função para salvar alterações na nuvem
            const saveDataToCloud = (newBudgets, newCampaigns, newManualPacing) => {
                setBudgets(newBudgets);
                setCampaigns(newCampaigns);
                setManualPacing(newManualPacing);

                if (window.db) {
                    setSyncStatus("A guardar...");
                    window.db.collection("dash_data").doc("main_state").set({
                        budgets: newBudgets,
                        campaigns: newCampaigns,
                        manualPacing: newManualPacing
                    }).then(() => {
                        setSyncStatus("Sincronizado com a nuvem");
                    }).catch(() => {
                        setSyncStatus("Erro ao guardar");
                    });
                }
            };

            const daysInMonth = useMemo(() => {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const totalDays = new Date(year, month + 1, 0).getDate();
                const days = [];
                const weekdays = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

                for (let i = 1; i <= totalDays; i++) {
                    const d = new Date(year, month, i);
                    days.push({
                        dateNum: i,
                        dateStr: `${String(i).padStart(2, '0')}/${String(month + 1).padStart(2, '0')}`,
                        weekday: weekdays[d.getDay()],
                        isPast: d < new Date(now.getFullYear(), now.getMonth(), now.getDate()),
                        isToday: d.toDateString() === now.toDateString()
                    });
                }
                return days;
            }, []);

            const formatBRL = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);

            const yesterdayTotalByProduct = useMemo(() => {
                const map = {};
                PRODUCTS.forEach(prod => {
                    map[prod] = campaigns
                        .filter(c => c.product === prod && c.status === "Ativa" && (selectedTool === "Todas" || c.tool === selectedTool))
                        .reduce((acc, c) => acc + (Number(c.yesterdayRealized) || 0), 0);
                });
                return map;
            }, [campaigns, selectedTool]);

            const pacingRows = useMemo(() => {
                const prodBudget = budgets[selectedProduct] || 0;
                const totalDays = daysInMonth.length;
                const defaultDaily = prodBudget / totalDays;

                let accumulated = 0;
                return daysInMonth.map((day, idx) => {
                    const key = `${selectedProduct}-${day.dateStr}`;
                    let realized = 0;

                    if (day.isPast) {
                        realized = manualPacing[key] !== undefined ? Number(manualPacing[key]) : (idx === 5 ? (yesterdayTotalByProduct[selectedProduct] || defaultDaily) : defaultDaily * 0.95);
                    } else if (day.isToday) {
                        realized = manualPacing[key] !== undefined ? Number(manualPacing[key]) : 0;
                    }

                    const planned = manualPacing[`plan-${key}`] !== undefined ? Number(manualPacing[`plan-${key}`]) : defaultDaily;
                    accumulated += realized;
                    const balance = prodBudget - accumulated;
                    const delta = realized - planned;

                    let status = "Dentro do Pacing";
                    if (realized > planned * 1.1) status = "Overbudget";
                    else if (realized < planned * 0.9 && day.isPast) status = "Underbudget";

                    return { ...day, planned, realized, delta, accumulated, balance, status, key };
                });
            }, [selectedProduct, budgets, daysInMonth, manualPacing, yesterdayTotalByProduct]);

            const currentKPIs = useMemo(() => {
                const budget = budgets[selectedProduct] || 0;
                const totalRealized = pacingRows.reduce((acc, r) => acc + r.realized, 0);
                const balance = budget - totalRealized;
                const pastDays = pacingRows.filter(r => r.isPast);
                const lastPast = pastDays[pastDays.length - 1] || pacingRows[0];
                const futureDaysCount = pacingRows.filter(r => !r.isPast && !r.isToday).length || 1;
                const suggestedPacing = balance > 0 ? balance / futureDaysCount : 0;

                return {
                    budget,
                    totalRealized,
                    balance,
                    lastDayRealized: lastPast?.realized || 0,
                    lastDayStatus: lastPast?.status || "Normal",
                    suggestedPacing
                };
            }, [selectedProduct, budgets, pacingRows]);

            const handleExportCSV = () => {
                let csv = "Tipo,Produto,Ferramenta,Orçamento/Nome,Valor/Detalhes\n";
                PRODUCTS.forEach(p => csv += `Orcamento,${p},Geral,-,${budgets[p]}\n`);
                campaigns.forEach(c => csv += `Campanha,${c.product},${c.tool},"${c.name}",${c.plannedDaily}\n`);
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_midia_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            };

            const handleOpenAI = () => {
                setIsAiModalOpen(true);
                setAiText("A analisar métricas de performance e pacing com Inteligência Artificial...");
                setTimeout(() => {
                    setAiText(`📊 Relatório de IA - ${selectedProduct}:\n\nO orçamento mensal de ${formatBRL(currentKPIs.budget)} está com consumo acumulado de ${formatBRL(currentKPIs.totalRealized)}. O saldo restante é de ${formatBRL(currentKPIs.balance)}.\n\nRecomendação: O pacing sugerido para os próximos dias é de ${formatBRL(currentKPIs.suggestedPacing)}/dia. Mantenha o monitoramento ativo nas campanhas de maior conversão para evitar desvios no orçamento BAU.`);
                }, 1000);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-slate-800 pb-6">
                        <div>
                            <div className="flex items-center gap-3">
                                <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                                    Gestão de Mídia Performance & Pacing
                                </h1>
                                <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-medium flex items-center gap-1.5">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    {syncStatus}
                                </span>
                            </div>
                            <p className="text-slate-400 text-sm mt-1">Controle de BAU, Pacing Diário e Campanhas (Google & Meta Ads)</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-3">
                            <button onClick={handleOpenAI} className="flex items-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg transition">
                                <Icon name="sparkles" className="w-4 h-4" /> Resumo IA
                            </button>
                            <button onClick={handleExportCSV} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 transition">
                                <Icon name="download" className="w-4 h-4" /> Exportar Backup
                            </button>
                            <button onClick={() => setIsShareModalOpen(true)} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition">
                                <Icon name="share" className="w-4 h-4" /> Partilhar Link
                            </button>
                        </div>
                    </header>

                    {/* Abas de Produtos */}
                    <div className="flex flex-wrap gap-2 mb-6 bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                        <button
                            onClick={() => setActiveTab("overview")}
                            className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "overview" ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}
                        >
                            📊 Visão Geral (Consolidado)
                        </button>
                        {PRODUCTS.map(prod => (
                            <button
                                key={prod}
                                onClick={() => { setSelectedProduct(prod); setActiveTab("pacing"); }}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab !== "overview" && selectedProduct === prod ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}
                            >
                                {prod}
                            </button>
                        ))}
                    </div>

                    {/* Filtro de Ferramentas */}
                    <div className="flex justify-between items-center mb-6 bg-slate-900/40 px-4 py-3 rounded-xl border border-slate-800/80">
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Canal:</span>
                            {["Todas", "Google Ads", "Meta Ads"].map(tool => (
                                <button
                                    key={tool}
                                    onClick={() => setSelectedTool(tool)}
                                    className={`px-3 py-1 rounded-md text-xs font-medium transition ${selectedTool === tool ? 'bg-slate-700 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                                >
                                    {tool}
                                </button>
                            ))}
                        </div>
                        {activeTab !== "overview" && (
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab("pacing")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'pacing' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    📅 Pacing Diário
                                </button>
                                <button onClick={() => setActiveTab("campaigns")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'campaigns' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    🚀 Campanhas
                                </button>
                                <button onClick={() => setActiveTab("reports")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'reports' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    📈 Relatórios & Gráficos
                                </button>
                            </div>
                        )}
                    </div>

                    {/* VISÃO GERAL */}
                    {activeTab === "overview" && (
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            {PRODUCTS.map(prod => {
                                const b = budgets[prod] || 0;
                                const spent = campaigns.filter(c => c.product === prod && c.status === "Ativa").reduce((acc, c) => acc + (Number(c.yesterdayRealized) * 30), 0);
                                const pct = Math.min(Math.round((spent / b) * 100), 100);
                                return (
                                    <div key={prod} className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow">
                                        <h3 className="text-sm font-medium text-slate-400">{prod}</h3>
                                        <p className="text-xl font-bold text-white mt-1">{formatBRL(b)}</p>
                                        <div className="mt-4">
                                            <div className="flex justify-between text-xs text-slate-400 mb-1">
                                                <span>Consumo Estimado</span>
                                                <span>{pct}%</span>
                                            </div>
                                            <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                                <div className="bg-blue-500 h-full rounded-full" style={{ width: `${pct}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* PACING DIÁRIO */}
                    {activeTab === "pacing" && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                                    <label className="text-xs font-semibold text-slate-400 uppercase">Orçamento Mensal BAU ({selectedProduct})</label>
                                    <input 
                                        type="number" 
                                        value={budgets[selectedProduct] || 0} 
                                        onChange={(e) => {
                                            const newBudgets = { ...budgets, [selectedProduct]: Number(e.target.value) };
                                            saveDataToCloud(newBudgets, campaigns, manualPacing);
                                        }}
                                        className="mt-2 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white font-bold text-lg focus:outline-none focus:border-blue-500"
                                    />
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                                    <span className="text-xs font-semibold text-slate-400 uppercase">Consumo Realizado</span>
                                    <p className="text-xl font-bold text-emerald-400 mt-2">{formatBRL(currentKPIs.totalRealized)}</p>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                                    <span className="text-xs font-semibold text-slate-400 uppercase">Saldo BAU Restante</span>
                                    <p className="text-xl font-bold text-blue-400 mt-2">{formatBRL(currentKPIs.balance)}</p>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                                    <span className="text-xs font-semibold text-slate-400 uppercase">Ontem: Realizado</span>
                                    <div className="flex items-center gap-2 mt-2">
                                        <span className="text-sm font-bold">{formatBRL(currentKPIs.lastDayRealized)}</span>
                                        <span className={`text-xs px-2 py-0.5 rounded-full ${currentKPIs.lastDayStatus === 'Overbudget' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                                            {currentKPIs.lastDayStatus}
                                        </span>
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                                    <span className="text-xs font-semibold text-slate-400 uppercase">Pacing Sugerido</span>
                                    <p className="text-xl font-bold text-purple-400 mt-2">{formatBRL(currentKPIs.suggestedPacing)}/dia</p>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm text-slate-300">
                                        <thead className="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
                                            <tr>
                                                <th className="px-4 py-3">Data</th>
                                                <th className="px-4 py-3">Dia</th>
                                                <th className="px-4 py-3">Meta Planejada (R$)</th>
                                                <th className="px-4 py-3">Realizado (R$)</th>
                                                <th className="px-4 py-3">Delta</th>
                                                <th className="px-4 py-3">Acumulado</th>
                                                <th className="px-4 py-3">Saldo BAU</th>
                                                <th className="px-4 py-3">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {pacingRows.map((row) => {
                                                const isOver10 = row.realized > row.planned * 1.1;
                                                return (
                                                    <tr key={row.dateStr} className={`hover:bg-slate-800/50 ${isOver10 ? 'bg-red-950/10' : ''} ${row.isToday ? 'bg-blue-950/20 font-semibold' : ''}`}>
                                                        <td className="px-4 py-3">{row.dateStr}</td>
                                                        <td className="px-4 py-3 text-slate-400">{row.weekday}</td>
                                                        <td className="px-4 py-3">
                                                            <input 
                                                                type="number"
                                                                value={manualPacing[`plan-${row.key}`] !== undefined ? manualPacing[`plan-${row.key}`] : Math.round(row.planned)}
                                                                onChange={(e) => {
                                                                    const newPacing = {...manualPacing, [`plan-${row.key}`]: e.target.value};
                                                                    saveDataToCloud(budgets, campaigns, newPacing);
                                                                }}
                                                                className="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-28 text-white focus:outline-none focus:border-blue-500"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <input 
                                                                type="number"
                                                                value={manualPacing[row.key] !== undefined ? manualPacing[row.key] : (row.realized ? Math.round(row.realized) : '')}
                                                                onChange={(e) => {
                                                                    const newPacing = {...manualPacing, [row.key]: e.target.value};
                                                                    saveDataToCloud(budgets, campaigns, newPacing);
                                                                }}
                                                                placeholder="0"
                                                                className="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-28 text-white focus:outline-none focus:border-blue-500"
                                                            />
                                                        </td>
                                                        <td className={`px-4 py-3 font-medium ${row.delta >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                                            {row.delta > 0 ? `+${formatBRL(row.delta)}` : formatBRL(row.delta)}
                                                        </td>
                                                        <td className="px-4 py-3">{formatBRL(row.accumulated)}</td>
                                                        <td className="px-4 py-3 text-blue-400">{formatBRL(row.balance)}</td>
                                                        <td className="px-4 py-3">
                                                            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${row.status === 'Overbudget' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                                                                {row.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CAMPANHAS */}
                    {activeTab === "campaigns" && (
                        <div className="space-y-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow">
                                <h3 className="text-lg font-bold text-white mb-4">Adicionar Nova Campanha</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const form = e.target;
                                    const newCamp = {
                                        id: Date.now(),
                                        name: form.name.value,
                                        product: form.product.value,
                                        tool: form.tool.value,
                                        plannedDaily: Number(form.plannedDaily.value),
                                        yesterdayRealized: Number(form.yesterdayRealized.value),
                                        status: "Ativa"
                                    };
                                    const newCamps = [...campaigns, newCamp];
                                    saveDataToCloud(budgets, newCamps, manualPacing);
                                    form.reset();
                                }} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                    <input name="name" placeholder="Nome da Campanha" required className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                    <select name="product" className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                                        {PRODUCTS.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                    <select name="tool" className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                                        <option value="Google Ads">Google Ads</option>
                                        <option value="Meta Ads">Meta Ads</option>
                                    </select>
                                    <input name="plannedDaily" type="number" placeholder="Investimento Diário Planejado" required className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                    <div className="flex gap-2">
                                        <input name="yesterdayRealized" type="number" placeholder="Realizado Ontem" required className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white w-full" />
                                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-lg font-medium flex items-center justify-center">
                                            <Icon name="plus" />
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow">
                                <table className="w-full text-left text-sm text-slate-300">
                                    <thead className="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
                                        <tr>
                                            <th className="px-4 py-3">Campanha</th>
                                            <th className="px-4 py-3">Produto</th>
                                            <th className="px-4 py-3">Ferramenta</th>
                                            <th className="px-4 py-3">Investimento Diário Planejado</th>
                                            <th className="px-4 py-3">Realizado Ontem</th>
                                            <th className="px-4 py-3">Status</th>
                                            <th className="px-4 py-3 text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {campaigns.filter(c => selectedTool === 'Todas' || c.tool === selectedTool).map(camp => (
                                            <tr key={camp.id} className="hover:bg-slate-800/50">
                                                <td className="px-4 py-3 font-semibold text-white">{camp.name}</td>
                                                <td className="px-4 py-3">{camp.product}</td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-0.5 rounded text-xs font-medium ${camp.tool === 'Google Ads' ? 'bg-amber-500/20 text-amber-300' : 'bg-blue-500/20 text-blue-300'}`}>
                                                        {camp.tool}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3">{formatBRL(camp.plannedDaily)}</td>
                                                <td className="px-4 py-3">
                                                    <input 
                                                        type="number"
                                                        value={camp.yesterdayRealized}
                                                        onChange={(e) => {
                                                            const val = Number(e.target.value);
                                                            const newCamps = campaigns.map(c => c.id === camp.id ? {...c, yesterdayRealized: val} : c);
                                                            saveDataToCloud(budgets, newCamps, manualPacing);
                                                        }}
                                                        className="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-28 text-white"
                                                    />
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400">
                                                        {camp.status}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3 text-right">
                                                    <button 
                                                        onClick={() => {
                                                            const newCamps = campaigns.filter(c => c.id !== camp.id);
                                                            saveDataToCloud(budgets, newCamps, manualPacing);
                                                        }}
                                                        className="text-red-400 hover:text-red-300 p-1 rounded"
                                                    >
                                                        <Icon name="trash" className="w-4 h-4" />
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* RELATÓRIOS */}
                    {activeTab === "reports" && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow">
                                <h3 className="text-lg font-bold text-white mb-4">Investimento por Ferramenta</h3>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>Google Ads</span>
                                            <span className="font-bold">62%</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                                            <div className="bg-amber-500 h-full rounded-full" style={{ width: '62%' }}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>Meta Ads</span>
                                            <span className="font-bold">38%</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                                            <div className="bg-blue-500 h-full rounded-full" style={{ width: '38%' }}></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow">
                                <h3 className="text-lg font-bold text-white mb-4">Distribuição do Orçamento Global</h3>
                                <div className="space-y-3">
                                    {PRODUCTS.map(p => {
                                        const totalB = Object.values(budgets).reduce((a,b)=>a+b, 1);
                                        const pct = Math.round(((budgets[p] || 0) / totalB) * 100);
                                        return (
                                            <div key={p} className="flex items-center justify-between text-sm">
                                                <span className="text-slate-300">{p}</span>
                                                <div className="flex items-center gap-3 w-1/2">
                                                    <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                                        <div className="bg-indigo-500 h-full rounded-full" style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                    <span className="text-xs font-bold text-slate-400">{pct}%</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL IA */}
                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                        <Icon name="sparkles" className="text-purple-400" /> Analista de Mídia IA
                                    </h3>
                                    <button onClick={() => setIsAiModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-300 text-sm whitespace-pre-line leading-relaxed">
                                    {aiText}
                                </div>
                                <button onClick={() => setIsAiModalOpen(false)} className="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl font-medium transition">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL PARTILHA */}
                    {isShareModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-2">Partilhar Dashboard</h3>
                                <p className="text-sm text-slate-400 mb-4">Copie o link abaixo para aceder ao painel publicado:</p>
                                <input 
                                    type="text" 
                                    readOnly 
                                    value={window.location.href}
                                    onClick={(e) => e.target.select()}
                                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm mb-4 select-all"
                                />
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            navigator.clipboard.writeText(window.location.href);
                                            alert("Link copiado para a área de transferência!");
                                        }}
                                        className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl font-medium transition"
                                    >
                                        Copiar Link
                                    </button>
                                    <button onClick={() => setIsShareModalOpen(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl font-medium transition">
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
