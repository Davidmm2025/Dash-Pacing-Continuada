                                <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                    <span className="text-[11px] font-semibold text-slate-500 uppercase">Saldo Restante</span>
                                    <p className="text-lg font-bold text-emerald-600 mt-1">{formatBRL(currentKPIs.balance)}</p>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                    <span className="text-[11px] font-semibold text-slate-500 uppercase">Inscritos (Real / Meta)</span>
                                    <p className="text-lg font-bold text-slate-900 mt-1">{formatNum(currentKPIs.totalInscritos)} <span className="text-xs font-normal text-slate-500">/ {formatNum(currentKPIs.inscritosGoal)}</span></p>
                                    <span className="text-xs font-semibold text-blue-600">{currentKPIs.inscritosPct}% atingido</span>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                    <span className="text-[11px] font-semibold text-slate-500 uppercase">Matriculados (Real / Meta)</span>
                                    <p className="text-lg font-bold text-slate-900 mt-1">{formatNum(currentKPIs.totalMatriculados)} <span className="text-xs font-normal text-slate-500">/ {formatNum(currentKPIs.matriculadosGoal)}</span></p>
                                    <span className="text-xs font-semibold text-emerald-600">{currentKPIs.matriculadosPct}% atingido</span>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                    <span className="text-[11px] font-semibold text-slate-500 uppercase">CPI (Real / Meta)</span>
                                    <p className="text-lg font-bold text-amber-700 mt-1">{formatBRL(currentKPIs.cpi)} <span className="text-[10px] font-normal text-slate-400">({formatBRL(currentKPIs.targetCpi)})</span></p>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                    <span className="text-[11px] font-semibold text-slate-500 uppercase">CPA (Real / Meta)</span>
                                    <p className="text-lg font-bold text-purple-700 mt-1">{formatBRL(currentKPIs.cpa)} <span className="text-[10px] font-normal text-slate-400">({formatBRL(currentKPIs.targetCpa)})</span></p>
                                </div>
                            </div>

                            {/* TABELA DE PACING COM CORES CORRIGIDAS (MAIOR QUE PLANEJADO = VERMELHO; MENOR = VERDE) */}
                            <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm text-slate-700">
                                        <thead className="bg-slate-100 text-slate-600 uppercase text-xs border-b border-slate-200">
                                            <tr>
                                                <th className="px-4 py-3">Data</th>
                                                <th className="px-4 py-3">Dia</th>
                                                <th className="px-4 py-3">Semana</th>
                                                <th className="px-4 py-3">Meta Planejada (R$)</th>
                                                <th className="px-4 py-3">Realizado (R$)</th>
                                                <th className="px-4 py-3">Delta</th>
                                                <th className="px-4 py-3">Acumulado</th>
                                                <th className="px-4 py-3">Saldo</th>
                                                <th className="px-4 py-3">Inscritos (Dia / Acum)</th>
                                                <th className="px-4 py-3">Matriculados (Dia / Acum)</th>
                                                <th className="px-4 py-3">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {filteredPacingRows.map((row) => {
                                                const isOver = row.realized > row.planned;
                                                return (
                                                    <tr key={row.dateStr} className={`hover:bg-slate-50 ${row.isToday ? 'bg-blue-50/60 font-semibold' : ''}`}>
                                                        <td className="px-4 py-3 text-slate-900">{row.dateStr}</td>
                                                        <td className="px-4 py-3 text-slate-500">{row.weekday}</td>
                                                        <td className="px-4 py-3 text-slate-400 text-xs">{row.weekNum}</td>
                                                        <td className="px-4 py-3">{formatBRL(row.planned)}</td>
                                                        <td className="px-4 py-3 font-semibold text-blue-700">{formatBRL(row.realized)}</td>
                                                        <td className={`px-4 py-3 font-bold ${isOver ? 'text-red-600' : 'text-emerald-600'}`}>
                                                            {row.delta > 0 ? `+${formatBRL(row.delta)}` : formatBRL(row.delta)}
                                                        </td>
                                                        <td className="px-4 py-3 text-slate-900">{formatBRL(row.accumulated)}</td>
                                                        <td className="px-4 py-3 text-emerald-600">{formatBRL(row.balance)}</td>
                                                        <td className="px-4 py-3 font-medium text-slate-800">
                                                            {row.inscritos} <span className="text-xs text-slate-400 font-normal">({row.accumulatedInscritos})</span>
                                                        </td>
                                                        <td className="px-4 py-3 font-medium text-slate-800">
                                                            {row.matriculados} <span className="text-xs text-slate-400 font-normal">({row.accumulatedMatriculados})</span>
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${row.status === 'Overbudget' ? 'bg-red-50 text-red-700 border border-red-200' : row.status === 'Underbudget' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}`}>
                                                                {row.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === "campaigns" && (
                        <div className="space-y-6">
                            <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                <table className="w-full text-left text-sm text-slate-700">
                                    <thead className="bg-slate-100 text-slate-600 uppercase text-xs border-b border-slate-200">
                                        <tr>
                                            <th className="px-4 py-3">Campanha ({selectedProduct})</th>
                                            <th className="px-4 py-3">Produto (Rateio)</th>
                                            <th className="px-4 py-3">Ferramenta</th>
                                            <th className="px-4 py-3">Status</th>
                                            <th className="px-4 py-3 text-center">Pacing & Conversões ({selectedMonth})</th>
                                            {!isReadOnly && <th className="px-4 py-3 text-right">Ações</th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {(campaigns || [])
                                            .filter(c => c && c.product === selectedProduct && (selectedTool === 'Todas' || c.tool === selectedTool))
                                            .map(camp => (
                                            <tr key={camp.id} className="hover:bg-slate-50">
                                                <td className="px-4 py-3 font-semibold text-slate-900">{camp.name}</td>
                                                <td className="px-4 py-3">{camp.product}</td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-0.5 rounded text-xs font-medium ${camp.tool === 'Google Ads' ? 'bg-amber-50 text-amber-800 border border-amber-200' : 'bg-blue-50 text-blue-800 border border-blue-200'}`}>
                                                        {camp.tool}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                                        {camp.status}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3 text-center">
                                                    <button 
                                                        onClick={() => setCampaignPacingModal(camp)}
                                                        className="inline-flex items-center gap-1.5 bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition"
                                                    >
                                                        <Icon name="calendar" className="w-3.5 h-3.5" /> {isReadOnly ? 'Ver Diário & Conversões' : 'Gerenciar Diário & Conversões'}
                                                    </button>
                                                </td>
                                                {!isReadOnly && (
                                                    <td className="px-4 py-3 text-right">
                                                        <button 
                                                            onClick={() => {
                                                                const newCamps = (campaigns || []).filter(c => c && c.id !== camp.id);
                                                                saveDataToCloud(budgetsByMonth, goalsByMonth, newCamps, campaignMap);
                                                            }}
                                                            className="text-red-500 hover:text-red-700 p-1 rounded"
                                                        >
                                                            <Icon name="trash" className="w-4 h-4" />
                                                        </button>
                                                    </td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === "reports" && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                                <h3 className="text-lg font-bold text-slate-900 mb-4">Investimento por Ferramenta ({selectedMonth})</h3>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-sm mb-1 text-slate-700">
                                            <span>Google Ads</span>
                                            <span className="font-bold">{overviewGlobalStats.googlePct}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                            <div className="bg-amber-500 h-full rounded-full" style={{ width: `${overviewGlobalStats.googlePct}%` }}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1 text-slate-700">
                                            <span>Meta Ads</span>
                                            <span className="font-bold">{overviewGlobalStats.metaPct}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                            <div className="bg-blue-600 h-full rounded-full" style={{ width: `${overviewGlobalStats.metaPct}%` }}></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                                <h3 className="text-lg font-bold text-slate-900 mb-4">Distribuição do Orçamento Global</h3>
                                <div className="space-y-3">
                                    {PRODUCTS.map(p => {
                                        const totalB = Object.values(currentMonthBudgets).reduce((a,b)=>a+b, 1);
                                        const pct = Math.round(((currentMonthBudgets[p] || 0) / (totalB || 1)) * 100);
                                        return (
                                            <div key={p} className="flex items-center justify-between text-sm">
                                                <span className="text-slate-700">{p}</span>
                                                <div className="flex items-center gap-3 w-1/2">
                                                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                        <div className="bg-blue-700 h-full rounded-full" style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                    <span className="text-xs font-bold text-slate-500">{pct}%</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {campaignPacingModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                            <Icon name="calendar" className="text-blue-700" /> Diário & Conversões ({selectedMonth}): {campaignPacingModal.name}
                                        </h3>
                                        <p className="text-xs text-slate-500 mt-0.5">Produto (Rateio): {campaignPacingModal.product} | Canal: {campaignPacingModal.tool}</p>
                                    </div>
                                    <button onClick={() => setCampaignPacingModal(null)} className="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
                                </div>

                                <div className="overflow-y-auto flex-1 pr-2 space-y-2">
                                    <table className="w-full text-left text-sm text-slate-700">
                                        <thead className="bg-slate-100 text-slate-600 uppercase text-xs sticky top-0">
                                            <tr>
                                                <th className="px-3 py-2">Data</th>
                                                <th className="px-3 py-2">Dia</th>
                                                <th className="px-3 py-2">Planejado (R$)</th>
                                                <th className="px-3 py-2">Realizado (R$)</th>
                                                <th className="px-3 py-2">Inscritos</th>
                                                <th className="px-3 py-2">Matriculados</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {daysInMonth.map(day => {
                                                const monthDaily = (campaignPacingModal.dailyData && campaignPacingModal.dailyData[selectedMonth]) || {};
                                                const currentDaily = monthDaily[day.dateStr] || { planned: '', realized: '', inscritos: '', matriculados: '' };
                                                return (
                                                    <tr key={day.dateStr} className="hover:bg-slate-50">
                                                        <td className="px-3 py-2 font-medium text-slate-900">{day.dateStr}</td>
                                                        <td className="px-3 py-2 text-slate-500">{day.weekday}</td>
                                                        <td className="px-3 py-2">
                                                            <input 
                                                                type="number"
                                                                disabled={isReadOnly}
                                                                value={currentDaily.planned}
                                                                placeholder="0"
                                                                onChange={(e) => {
                                                                    const val = e.target.value;
                                                                    const updatedMonthDaily = { ...monthDaily, [day.dateStr]: { ...currentDaily, planned: val } };
                                                                    const updatedDailyData = { ...(campaignPacingModal.dailyData || {}), [selectedMonth]: updatedMonthDaily };
                                                                    setCampaignPacingModal({ ...campaignPacingModal, dailyData: updatedDailyData });
                                                                }}
                                                                className="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-24 text-slate-900 disabled:opacity-70"
                                                            />
                                                        </td>
                                                        <td className="px-3 py-2">
                                                            <input 
                                                                type="number"
                                                                disabled={isReadOnly}
                                                                value={currentDaily.realized}
                                                                placeholder="0"
                                                                onChange={(e) => {
                                                                    const val = e.target.value;
                                                                    const updatedMonthDaily = { ...monthDaily, [day.dateStr]: { ...currentDaily, realized: val } };
                                                                    const updatedDailyData = { ...(campaignPacingModal.dailyData || {}), [selectedMonth]: updatedMonthDaily };
                                                                    setCampaignPacingModal({ ...campaignPacingModal, dailyData: updatedDailyData });
                                                                }}
                                                                className="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-24 text-slate-900 font-semibold text-blue-700 disabled:opacity-70"
                                                            />
                                                        </td>
                                                        <td className="px-3 py-2">
                                                            <input 
                                                                type="number"
                                                                disabled={isReadOnly}
                                                                value={currentDaily.inscritos}
                                                                placeholder="0"
                                                                onChange={(e) => {
                                                                    const val = e.target.value;
                                                                    const updatedMonthDaily = { ...monthDaily, [day.dateStr]: { ...currentDaily, inscritos: val } };
                                                                    const updatedDailyData = { ...(campaignPacingModal.dailyData || {}), [selectedMonth]: updatedMonthDaily };
                                                                    setCampaignPacingModal({ ...campaignPacingModal, dailyData: updatedDailyData });
                                                                }}
                                                                className="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-24 text-slate-900 font-semibold text-slate-800 disabled:opacity-70"
                                                            />
                                                        </td>
                                                        <td className="px-3 py-2">
                                                            <input 
                                                                type="number"
                                                                disabled={isReadOnly}
                                                                value={currentDaily.matriculados}
                                                                placeholder="0"
                                                                onChange={(e) => {
                                                                    const val = e.target.value;
                                                                    const updatedMonthDaily = { ...monthDaily, [day.dateStr]: { ...currentDaily, matriculados: val } };
                                                                    const updatedDailyData = { ...(campaignPacingModal.dailyData || {}), [selectedMonth]: updatedMonthDaily };
                                                                    setCampaignPacingModal({ ...campaignPacingModal, dailyData: updatedDailyData });
                                                                }}
                                                                className="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-24 text-slate-900 font-semibold text-emerald-700 disabled:opacity-70"
                                                            />
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="mt-4 pt-3 border-t border-slate-100 flex gap-3">
                                    {!isReadOnly && (
                                        <button 
                                            onClick={() => {
                                                const updatedCampaigns = (campaigns || []).map(c => c && c.id === campaignPacingModal.id ? campaignPacingModal : c);
                                                saveDataToCloud(budgetsByMonth, goalsByMonth, updatedCampaigns, campaignMap);
                                                setCampaignPacingModal(null);
                                            }}
                                            className="flex-1 bg-blue-700 hover:bg-blue-800 text-white py-2.5 rounded-xl font-medium transition shadow"
                                        >
                                            Guardar e Atualizar Diário & Conversões
                                        </button>
                                    )}
                                    <button onClick={() => setCampaignPacingModal(null)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-medium transition">
                                        {isReadOnly ? 'Fechar' : 'Cancelar'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        <Icon name="sparkles" className="text-purple-600" /> Projeção IA & Ritmo de Mídia
                                    </h3>
                                    <button onClick={() => setIsAiModalOpen(false)} className="text-slate-400 hover:text-slate-700">✕</button>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-700 text-sm whitespace-pre-line leading-relaxed">
                                    {aiText}
                                </div>
                                <button onClick={() => setIsAiModalOpen(false)} className="mt-6 w-full bg-blue-700 hover:bg-blue-800 text-white py-2 rounded-xl font-medium transition shadow">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {isShareModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">Partilhar Dashboard</h3>
                                <p className="text-sm text-slate-500 mb-4">Copie o link abaixo para aceder ao painel publicado:</p>
                                <input 
                                    type="text" 
                                    readOnly 
                                    value={window.location.href}
                                    onClick={(e) => e.target.select()}
                                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 text-sm mb-4 select-all"
                                />
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            navigator.clipboard.writeText(window.location.href);
                                            alert("Link copiado para a área de transferência!");
                                        }}
                                        className="flex-1 bg-blue-700 hover:bg-blue-800 text-white py-2 rounded-xl font-medium transition shadow"
                                    >
                                        Copiar Link
                                    </button>
                                    <button onClick={() => setIsShareModalOpen(false)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-medium transition">
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
