        function App() {
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = sessionStorage.getItem("unicesumar_auth_user");
                    return saved ? JSON.parse(saved) : null;
                } catch(e) {
                    return null;
                }
            });

            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [loginError, setLoginError] = useState("");

            const currentMonthDefault = (() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            })();

            const [selectedMonth, setSelectedMonth] = useState(currentMonthDefault);
            const [activeTab, setActiveTab] = useState("overview");
            const [selectedProduct, setSelectedProduct] = useState("Pós-Graduação");
            const [selectedTool, setSelectedTool] = useState("Todas");
            const [pacingFilter, setPacingFilter] = useState("Todos");

            const [campaignMap, setCampaignMap] = useState(INITIAL_CAMPAIGN_MAP);
            const [newMapCampName, setNewMapCampName] = useState("");
            const [newMapProduct, setNewMapProduct] = useState("Pós-Graduação");

                [currentMonthDefault]: {

                    "Pós-Médica": 30000,

                    "Profissionalizantes": 20000

            });

                    "Pós-Graduação": { cpq: 1200, matriculados: 250 },
                    "Pós-Médica": { cpq: 600, matriculados: 120 },
                    "Pós-Injetáveis": { cpq: 600, matriculados: 120 },

                }
            });

            const [monthlyGridData, setMonthlyGridData] = useState({});
            const [campaigns, setCampaigns] = useState([]);

            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            const [aiText, setAiText] = useState("");
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [syncStatus, setSyncStatus] = useState("A carregar nuvem...");
            const [campaignPacingModal, setCampaignPacingModal] = useState(null);

            const [batchStartDay, setBatchStartDay] = useState(1);
            const [batchEndDay, setBatchEndDay] = useState(10);
            const [batchPlannedValue, setBatchPlannedValue] = useState("");

            const isReadOnly = currentUser?.role === 'readonly';

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError("");
                const u = loginUser.trim();
                const p = loginPass;

                let authObj = null;
                if (u === "david.marconato" && p === "#David2026") {
                    authObj = { name: "David Martins Marconato", role: "editor" };
                } else if (u === "thais.mazzieiro" && p === "#Thais2026") {
                    authObj = { name: "Thais Mazzieiro", role: "editor" };
                } else if (u === "BU" && p === "#BUcontinuada") {
                    authObj = { name: "BU (Somente Leitura)", role: "readonly" };
                } else {
                    setLoginError("Login ou senha incorretos.");
                    return;
                }

                setCurrentUser(authObj);
                try {
                    sessionStorage.setItem("unicesumar_auth_user", JSON.stringify(authObj));
                } catch(e) {}
            };

            const handleLogout = () => {
                setCurrentUser(null);
                try {
                    sessionStorage.removeItem("unicesumar_auth_user");
                } catch(e) {}
            };

            const daysInMonth = useMemo(() => {
                const parts = (selectedMonth || currentMonthDefault).split('-');
                const year = Number(parts[0]) || 2026;
                const month = Number(parts[1]) || 1;
                const totalDays = new Date(year, month, 0).getDate();
                const days = [];
                const weekdays = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
                const now = new Date();

                for (let i = 1; i <= totalDays; i++) {
                    const d = new Date(year, month - 1, i);
                    const weekNum = Math.ceil(i / 7);
                    days.push({
                        dateNum: i,
                        dateStr: `${String(i).padStart(2, '0')}/${String(month).padStart(2, '0')}`,
                        weekday: weekdays[d.getDay()],
                        weekNum: `Semana ${weekNum}`,
                        isWeekend: d.getDay() === 0 || d.getDay() === 6,
                        isPast: d < new Date(now.getFullYear(), now.getMonth(), now.getDate()),
                        isToday: d.toDateString() === now.toDateString()
                    });
                }
                return days;
            }, [selectedMonth]);

            const dMinus1DateStr = useMemo(() => {
                const d1 = new Date();
                d1.setDate(d1.getDate() - 1);
                const day = String(d1.getDate()).padStart(2, '0');
                const month = String(d1.getMonth() + 1).padStart(2, '0');
                return `${day}/${month}`;
            }, []);

            useEffect(() => {
                if (!window.db) return;
                const docRef = window.db.collection("dash_data").doc("main_state_multi_month_v3");
                
                const unsubscribe = docRef.onSnapshot((docSnap) => {
                    if (docSnap && docSnap.exists) {
                        const data = docSnap.data() || {};
                        if (data.budgetsByMonth) setBudgetsByMonth(prev => ({ ...prev, ...data.budgetsByMonth }));
                        if (data.goalsByMonth) setGoalsByMonth(prev => ({ ...prev, ...data.goalsByMonth }));
                        if (data.monthlyGridData) setMonthlyGridData(prev => ({ ...prev, ...data.monthlyGridData }));
                        
                        if (Array.isArray(data.campaigns)) {
                            const validCampaigns = data.campaigns.filter(c => {
                                if (!c || !c.name) return false;
                                const n = c.name.toLowerCase();
                                return !n.includes('total') && !n.includes('resultados') && !n.includes('results');
                            });
                            setCampaigns(validCampaigns);
                        }

                        if (data.campaignMap) setCampaignMap(prev => ({ ...prev, ...data.campaignMap }));
                        setSyncStatus("Sincronizado com a nuvem (Protegido)");
                    } else {
                        docRef.set({ budgetsByMonth, goalsByMonth, monthlyGridData, campaigns, campaignMap }).catch(() => {});
                        setSyncStatus("Sincronizado com a nuvem (Protegido)");
                    }
                }, (error) => {
                    console.error("Erro ao sincronizar:", error);
                    setSyncStatus("Modo local (Offline - Protegido)");
                });

                return () => unsubscribe();
            }, []);

            const saveDataToCloud = (newBudgets, newGoals, newGrid, newCampaigns, newMap) => {
                if (isReadOnly) return;
                const b = newBudgets || budgetsByMonth;
                const g = newGoals || goalsByMonth;
                const gr = newGrid || monthlyGridData;
                const c = newCampaigns || campaigns;
                const m = newMap || campaignMap;

                setBudgetsByMonth(b);
                setGoalsByMonth(g);
                setMonthlyGridData(gr);
                setCampaigns(c);
                setCampaignMap(m);

                if (window.db) {
                    setSyncStatus("A guardar...");
                    window.db.collection("dash_data").doc("main_state_multi_month_v3").set({
                        budgetsByMonth: b,
                        goalsByMonth: g,
                        monthlyGridData: gr,
                        campaigns: c,
                        campaignMap: m
                    }, { merge: true }).then(() => {
                        setSyncStatus("Sincronizado com a nuvem (Protegido)");
                    }).catch(() => {
                        setSyncStatus("Erro ao guardar");
                    });
                }
            };

            const formatBRL = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
            const formatNum = (val) => new Intl.NumberFormat('pt-BR').format(Math.round(val || 0));

            const currentMonthBudgets = useMemo(() => {
                return (budgetsByMonth && budgetsByMonth[selectedMonth]) || {};
            }, [budgetsByMonth, selectedMonth]);

            const currentMonthGoals = useMemo(() => {
                return (goalsByMonth && goalsByMonth[selectedMonth] && goalsByMonth[selectedMonth][selectedProduct]) || { cpq: 0, matriculados: 0 };
            }, [goalsByMonth, selectedMonth, selectedProduct]);

            const totalSpentByProduct = useMemo(() => {
                const map = {};
                PRODUCTS.forEach(prod => {
                    let total = 0;
                    (campaigns || []).filter(c => c && c.product === prod && c.status === "Ativa" && (selectedTool === "Todas" || c.tool === selectedTool)).forEach(c => {
                        const monthDaily = c?.dailyData?.[selectedMonth];
                        if (monthDaily && typeof monthDaily === 'object') {
                            Object.values(monthDaily).forEach(d => {
                                total += Number(d?.realized) || 0;
                            });
                        }
                    });
                    map[prod] = total;
                });
                return map;
            }, [campaigns, selectedMonth, selectedTool]);

            const overviewGlobalStats = useMemo(() => {
                let totalBudget = 0;
                let totalSpent = 0;
                let googleSpent = 0;
                let metaSpent = 0;
                let totalCpq = 0;
                let totalMatriculados = 0;
                let totalCpqGoal = 0;
                let totalMatriculadosGoal = 0;

                const curBudgets = (budgetsByMonth && budgetsByMonth[selectedMonth]) || {};
                const curGoals = (goalsByMonth && goalsByMonth[selectedMonth]) || {};
                const curGrid = (monthlyGridData && monthlyGridData[selectedMonth]) || {};

                PRODUCTS.forEach(p => {
                    totalBudget += Number(curBudgets[p]) || 0;
                    const g = curGoals[p] || {};
                    totalCpqGoal += Number(g.cpq) || 0;
                    totalMatriculadosGoal += Number(g.matriculados) || 0;

                    const prodGrid = curGrid[p] || {};
                    Object.values(prodGrid).forEach(d => {
                        totalCpq += Number(d?.cpqVal) || 0;
                        totalMatriculados += Number(d?.matriculadosVal) || 0;
                    });
                });

                (campaigns || []).forEach(c => {
                    if (c && c.status === "Ativa") {
                        const monthDaily = c?.dailyData?.[selectedMonth];
                        if (monthDaily && typeof monthDaily === 'object') {
                            Object.values(monthDaily).forEach(d => {
                                const val = Number(d?.realized) || 0;
                                totalSpent += val;
                                if (c.tool === "Google Ads") googleSpent += val;
                                if (c.tool === "Meta Ads") metaSpent += val;
                            });
                        }
                    }
                });

                const totalPct = totalBudget > 0 ? Math.min(Math.round((totalSpent / totalBudget) * 100), 100) : 0;
                const googlePct = totalSpent > 0 ? Math.round((googleSpent / totalSpent) * 100) : 0;
                const metaPct = totalSpent > 0 ? Math.round((metaSpent / totalSpent) * 100) : 0;
                const cpqPct = totalCpqGoal > 0 ? Math.round((totalCpq / totalCpqGoal) * 100) : 0;
                const matriculadosPct = totalMatriculadosGoal > 0 ? Math.round((totalMatriculados / totalMatriculadosGoal) * 100) : 0;
                const avgCpqCost = totalCpq > 0 ? totalSpent / totalCpq : 0;
                const avgCpaCost = totalMatriculados > 0 ? totalSpent / totalMatriculados : 0;

                return { totalBudget, totalSpent, totalPct, googleSpent, metaSpent, googlePct, metaPct, totalCpq, totalMatriculados, totalCpqGoal, totalMatriculadosGoal, cpqPct, matriculadosPct, avgCpqCost, avgCpaCost };
            }, [budgetsByMonth, goalsByMonth, monthlyGridData, campaigns, selectedMonth]);

            // PACING DINÂMICO ("VIVO") RECALCULADO COM A SOBRA OU DÉFICIT ANTERIOR
            const pacingRows = useMemo(() => {
                const prodBudget = Number(currentMonthBudgets[selectedProduct]) || 0;
                const totalDaysCount = daysInMonth.length || 30;
                const targetCampaigns = (campaigns || []).filter(c => c && c.product === selectedProduct && c.status === "Ativa");

                let accumulated = 0;
                let accumulatedGlobal = 0;
                let accumulatedCpq = 0;
                let accumulatedMatriculados = 0;

                const prodGrid = (monthlyGridData && monthlyGridData[selectedMonth] && monthlyGridData[selectedMonth][selectedProduct]) || {};

                // Primeiro passo: passamos por todos os dias para calcular os realizados e acumulados por dia
                const rawDays = daysInMonth.map((day, idx) => {
                    let dayRealized = 0;
                    let dayRealizedGlobal = 0;

                    targetCampaigns.forEach(c => {
                        const dEntry = c?.dailyData?.[selectedMonth]?.[day.dateStr];
                        if (dEntry) {
                            const r = Number(dEntry.realized) || 0;
                            dayRealizedGlobal += r;
                            if (selectedTool === "Todas" || c.tool === selectedTool) {
                                dayRealized += r;
                            }
                        }
                    });

                    const dayGrid = prodGrid[day.dateStr] || { cpqVal: '', matriculadosVal: '' };
                    const dayCpq = Number(dayGrid.cpqVal) || 0;
                    const dayMatriculados = Number(dayGrid.matriculadosVal) || 0;

                    const prevAccumulatedGlobal = accumulatedGlobal; // Acumulado até o dia anterior (excluindo hoje)

                    accumulated += dayRealized;
                    accumulatedGlobal += dayRealizedGlobal;
                    accumulatedCpq += dayCpq;
                    accumulatedMatriculados += dayMatriculados;

                    const balance = prodBudget - accumulatedGlobal;
                    const dayCpqCost = dayCpq > 0 ? dayRealized / dayCpq : 0;
                    const dayCpaCost = dayMatriculados > 0 ? dayRealized / dayMatriculados : 0;

                    return {
                        ...day,
                        realized: dayRealized,
                        accumulated,
                        balance,
                        cpqVal: dayCpq,
                        cpqCost: dayCpqCost,
                        matriculadosVal: dayMatriculados,
                        cpaCost: dayCpaCost,
                        accumulatedCpq,
                        accumulatedMatriculados,
                        prevAccumulatedGlobal
                    };
                });

                // Segundo passo: Cálculo do Pacing Ideal Dinâmico (Vivo)
                return rawDays.map((row, idx) => {
                    const daysRemaining = totalDaysCount - idx; // Dias restantes no mês incluindo o dia atual
                    const remainingBudget = prodBudget - row.prevAccumulatedGlobal; // O que sobrou do orçamento para gastar
                    
                    // Pacing ideal dinâmico: saldo restante dividido pelos dias restantes
                    const pacingIdeal = daysRemaining > 0 ? Math.max(0, remainingBudget / daysRemaining) : 0;
                    
                    const delta = row.realized - pacingIdeal;

                    let status = "Dentro do Pacing";
                    if (row.realized > pacingIdeal) {
                        status = "Overbudget";
                    } else if (row.realized < pacingIdeal) {
                        status = "Underbudget";
                    }

                    return {
                        ...row,
                        pacingIdeal,
                        delta,
                        status
                    };
                });
            }, [selectedProduct, currentMonthBudgets, daysInMonth, campaigns, selectedMonth, selectedTool, monthlyGridData]);

            const filteredPacingRows = useMemo(() => {
                return (pacingRows || []).filter(row => {
                    if (pacingFilter === "Todos") return true;
                    if (pacingFilter.startsWith("Semana")) return row.weekNum === pacingFilter;
                    if (pacingFilter === "Dias Úteis") return !row.isWeekend;
                    if (pacingFilter === "Fins de Semana") return row.isWeekend;
                    return true;
                });
            }, [pacingRows, pacingFilter]);

            // Resumo de comparação na aba de campanhas usando o pacing ideal dinâmico do dia correspondente (D-1)
            const campaignPacingSummary = useMemo(() => {
                const activeCamps = (campaigns || []).filter(c => c && c.product === selectedProduct && c.status === "Ativa" && (selectedTool === 'Todas' || c.tool === selectedTool));
                
                let totalSetadoD1 = 0;
                activeCamps.forEach(camp => {
                    const monthDaily = camp?.dailyData?.[selectedMonth];
                    if (monthDaily && typeof monthDaily === 'object') {
                        const d1Entry = monthDaily[dMinus1DateStr];
                        if (d1Entry && d1Entry.planned !== '') {
                            totalSetadoD1 += Number(d1Entry.planned) || 0;
                        }
                    }
                });

                // Encontrar o pacing ideal dinâmico correspondente ao dia D-1 ou o atual
                const matchedRow = (pacingRows || []).find(r => r.dateStr === dMinus1DateStr) || pacingRows[0];
                const dynamicPacingIdeal = matchedRow ? matchedRow.pacingIdeal : (Number(currentMonthBudgets[selectedProduct]) / 30);

                const diff = totalSetadoD1 - dynamicPacingIdeal;
                const isOver = diff > 0;

                return {
                    totalSetadoD1,
                    pacingIdealDaily: dynamicPacingIdeal,
                    diff,
                    isOver,
                    activeCount: activeCamps.length
                };
            }, [campaigns, selectedProduct, selectedTool, selectedMonth, dMinus1DateStr, pacingRows, currentMonthBudgets]);

            const updateGridCell = (dayStr, field, val) => {
                if (isReadOnly) return;
                const updatedGrid = JSON.parse(JSON.stringify(monthlyGridData || {}));
                if (!updatedGrid[selectedMonth]) updatedGrid[selectedMonth] = {};
                if (!updatedGrid[selectedMonth][selectedProduct]) updatedGrid[selectedMonth][selectedProduct] = {};
                if (!updatedGrid[selectedMonth][selectedProduct][dayStr]) {
                    updatedGrid[selectedMonth][selectedProduct][dayStr] = { cpqVal: '', matriculadosVal: '' };
                }
                updatedGrid[selectedMonth][selectedProduct][dayStr][field] = val;
                saveDataToCloud(budgetsByMonth, goalsByMonth, updatedGrid, campaigns, campaignMap);
            };

            const parseCSVLine = (text, separator = ',') => {
                const result = [];
                let insideQuotes = false;
                let entry = '';
                for (let i = 0; i < text.length; i++) {
                    const c = text[i];
                    if (c === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (c === separator && !insideQuotes) {
                        result.push(entry.trim());
                        entry = '';
                    } else {
                        entry += c;
                    }
                }
                result.push(entry.trim());
                return result.map(item => item.replace(/^"|"$/g, ''));
            };

            const parseCost = (valStr) => {
                if (!valStr) return 0;
                let clean = String(valStr).replace(/[^\d,\.-]/g, '');
                if (clean.includes(',') && clean.includes('.')) {
                    if (clean.lastIndexOf(',') > clean.lastIndexOf('.')) {
                        clean = clean.replace(/\./g, '').replace(',', '.');
                    } else {
                        clean = clean.replace(/,/g, '');
                    }
                } else if (clean.includes(',')) {
                    clean = clean.replace(',', '.');
                }
                return Number(clean) || 0;
            };

            const resolveProductForCampaign = (campName) => {
                const clean = (campName || "").trim();
                if (campaignMap[clean]) {
                    return campaignMap[clean];
                }
                const upper = clean.toUpperCase();
                if (upper.includes('-THP-') || upper.includes('-THE-') || upper.includes('-THR-') || upper.includes('-TEC-') || upper.includes('PODOLOGIA') || upper.includes('ENFERMAGEM') || upper.includes('RADIOLOGIA')) return 'Técnico';
                if (upper.includes('-HPOS-') || upper.includes('-LPOS-')) return 'Pós-Médica';
                if (upper.includes('-SES-')) return 'Pós-Injetáveis';
                if (upper.includes('-PRO-')) return 'Profissionalizantes';
                if (upper.includes('-POS-')) return 'Pós-Graduação';
                return 'Pós-Graduação';
            };

            const cleanString = (str) => {
                if (!str) return "";
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
            };

            const handleUniversalCSVUpload = (e) => {
                if (isReadOnly) return;
                const files = e.target.files;
                if (!files || files.length === 0) return;

                let updatedCampaigns = JSON.parse(JSON.stringify(campaigns));

                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const content = event.target.result;
                        const lines = content.split(/\r?\n/);
                        if (lines.length < 2) return;

                        const firstLine = lines[0];
                        const sep = firstLine.includes(';') ? ';' : ',';
                        const headers = parseCSVLine(firstLine, sep).map(h => h.toLowerCase().trim());

                        let nameCol = 0;
                        let dateCol = -1;
                        let costCol = -1;

                        headers.forEach((h, idx) => {
                            if (h.includes('campanha') || h.includes('campaign') || h.includes('nome')) nameCol = idx;
                            if (h.includes('data') || h.includes('date') || h.includes('dia') || h.includes('day') || h.includes('reporting starts')) {
                                if (dateCol === -1) dateCol = idx;
                            }
                            if (h.includes('valor') || h.includes('custo') || h.includes('cost') || h.includes('spent') || h.includes('gasto') || h.includes('amount') || h.includes('imposto')) {
                                if (costCol === -1) costCol = idx;
                            }
                        });

                        const fileAggregates = {};

                        for (let i = 1; i < lines.length; i++) {
                            const line = lines[i];
                            if (!line.trim()) continue;
                            
                            const cols = parseCSVLine(line, sep);
                            const campName = cols[nameCol] || cols[0];
                            
                            if (!campName) continue;
                            const lowerName = campName.toLowerCase();
                            
                            if (lowerName.includes('total') || lowerName.includes('resultados') || lowerName.includes('results') || lowerName.includes('campanha') || lowerName.includes('nome da')) {
                                continue;
                            }

                            let dateStrCsv = "";
                            if (dateCol !== -1 && cols[dateCol]) {
                                dateStrCsv = cols[dateCol];
                            } else {
                                for (let j = 0; j < cols.length; j++) {
                                    const val = cols[j];
                                    if (/^\d{4}-\d{2}-\d{2}$/.test(val) || /^\d{2}\/\d{2}\/\d{4}$/.test(val)) {
                                        dateStrCsv = val;
                                        break;
                                    }
                                }
                            }

                            let year, month, day;
                            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStrCsv)) {
                                [year, month, day] = dateStrCsv.split('-');
                            } else if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStrCsv)) {
                                const parts = dateStrCsv.split('/');
                                day = parts[0];
                                month = parts[1];
                                year = parts[2];
                            } else {
                                continue;
                            }

                            const monthKey = `${year}-${month}`;
                            const dateKey = `${day}/${month}`; 

                            let cost = 0;
                            if (costCol !== -1 && cols[costCol]) {
                                cost = parseCost(cols[costCol]);
                            } else {
                                for (let j = cols.length - 1; j >= 1; j--) {
                                    const parsed = parseCost(cols[j]);
                                    if (!isNaN(parsed) && parsed > 0) {
                                        cost = parsed;
                                        break;
                                    }
                                }
                            }
                            if (isNaN(cost)) cost = 0;

                            let toolType = campName.toUpperCase().includes('FB') ? 'Meta Ads' : 'Google Ads';
                            const targetProduct = resolveProductForCampaign(campName);

                            if (!fileAggregates[campName]) {
                                fileAggregates[campName] = { product: targetProduct, tool: toolType, months: {} };
                            }
                            if (!fileAggregates[campName].months[monthKey]) {
                                fileAggregates[campName].months[monthKey] = {};
                            }
                            fileAggregates[campName].months[monthKey][dateKey] = (fileAggregates[campName].months[monthKey][dateKey] || 0) + cost;
                        }

                        let importedTotal = 0;

                        Object.entries(fileAggregates).forEach(([campName, campData]) => {
                            const { product, tool, months } = campData;

                            let camp = updatedCampaigns.find(c => c && cleanString(c.name) === cleanString(campName));
                            
                            if (!camp) {
                                camp = {
                                    id: Date.now() + Math.random(),
                                    name: campName,
                                    product: product,
                                    tool: tool,
                                    status: "Ativa",
                                    dailyData: {}
                                };
                                updatedCampaigns.push(camp);
                            } else {
                                camp.tool = tool;
                            }

                            const campDaily = { ...(camp.dailyData || {}) };

                            Object.entries(months).forEach(([monthKey, datesMap]) => {
                                const monthDaily = { ...(campDaily[monthKey] || {}) };

                                Object.entries(datesMap).forEach(([dateKey, totalCost]) => {
                                    const existingDay = monthDaily[dateKey] || { planned: '', realized: 0 };
                                    monthDaily[dateKey] = {
                                        ...existingDay,
                                        realized: totalCost 
                                    };
                                    importedTotal++;
                                });

                                campDaily[monthKey] = monthDaily;
                            });

                            camp.dailyData = campDaily;
                        });

                        updatedCampaigns = updatedCampaigns.filter(c => {
                            if (!c || !c.name) return false;
                            const n = c.name.toLowerCase();
                            return !n.includes('total') && !n.includes('resultados') && !n.includes('results');
                        });

                        saveDataToCloud(budgetsByMonth, goalsByMonth, monthlyGridData, updatedCampaigns, campaignMap);
                        alert(`Sucesso! Ficheiro processado e sincronizado. ${importedTotal} dias foram atualizados de forma exata e segura.`);
                        e.target.value = '';
                    };
                    reader.readAsText(file, 'UTF-8');
                });
            };

            const handleGeneratePacing = () => {
                if (isReadOnly) return;
                alert("Pacing Dinâmico recalculado com sucesso pela IA para " + selectedProduct + "!");
            };

            const updateBudgetAndGoalsForProduct = (prodName, newBudget, newCpq, newMatriculados) => {
                if (isReadOnly) return;
                const updatedBudgets = { ...(budgetsByMonth || {}) };
                if (!updatedBudgets[selectedMonth]) updatedBudgets[selectedMonth] = {};

                const updatedGoals = { ...(goalsByMonth || {}) };
                if (!updatedGoals[selectedMonth]) updatedGoals[selectedMonth] = {};

                updatedBudgets[selectedMonth][prodName] = Number(newBudget);
                updatedGoals[selectedMonth][prodName] = {
                    cpq: Number(newCpq),
                    matriculados: Number(newMatriculados)
                };

                saveDataToCloud(updatedBudgets, updatedGoals, monthlyGridData, campaigns, campaignMap);
            };

            const currentKPIs = useMemo(() => {
                const budget = Number(currentMonthBudgets[selectedProduct]) || 0;
                
                let globalRealized = 0;
                (campaigns || []).filter(c => c && c.product === selectedProduct && c.status === "Ativa").forEach(c => {
                    const monthDaily = c?.dailyData?.[selectedMonth];
                    if (monthDaily && typeof monthDaily === 'object') {
                        Object.values(monthDaily).forEach(d => {
                            globalRealized += Number(d?.realized) || 0;
                        });
                    }
                });

                const totalRealized = (pacingRows || []).reduce((acc, r) => acc + (r.realized || 0), 0);
                const totalCpq = (pacingRows || []).reduce((acc, r) => acc + (r.cpqVal || 0), 0);
                const totalMatriculados = (pacingRows || []).reduce((acc, r) => acc + (r.matriculadosVal || 0), 0);

                const cpqGoal = Number(currentMonthGoals.cpq) || 0;
                const matriculadosGoal = Number(currentMonthGoals.matriculados) || 0;

                const cpqPct = cpqGoal > 0 ? Math.min(Math.round((totalCpq / cpqGoal) * 100), 100) : 0;
                const matriculadosPct = matriculadosGoal > 0 ? Math.min(Math.round((totalMatriculados / matriculadosGoal) * 100), 100) : 0;

                const cpqCost = totalCpq > 0 ? totalRealized / totalCpq : 0;
                const cpaCost = totalMatriculados > 0 ? totalRealized / totalMatriculados : 0;

                const targetCpqCost = cpqGoal > 0 ? budget / cpqGoal : 0;
                const targetCpaCost = matriculadosGoal > 0 ? budget / matriculadosGoal : 0;

                const balance = budget - globalRealized; 
                
                const futureDaysCount = (pacingRows || []).filter(r => !r.isPast && !r.isToday).length || 1;
                const suggestedPacing = balance > 0 ? balance / futureDaysCount : 0;

                return {
                    budget,
                    globalRealized,
                    totalRealized,
                    balance,
                    totalCpq,
                    totalMatriculados,
                    cpqGoal,
                    matriculadosGoal,
                    cpqPct,
                    matriculadosPct,
                    cpqCost,
                    cpaCost,
                    targetCpqCost,
                    targetCpaCost,
                    suggestedPacing
                };
            }, [selectedProduct, currentMonthBudgets, currentMonthGoals, pacingRows, campaigns, selectedMonth]);

            const getMonthStatsForComparison = (monthKey) => {
                let mBudget = 0;
                let mSpent = 0;
                let mCpq = 0;
                let mMatriculados = 0;
                let mCpqGoal = 0;
                let mMatriculadosGoal = 0;

                const mBudgets = (budgetsByMonth && budgetsByMonth[monthKey]) || {};
                const mGoals = (goalsByMonth && goalsByMonth[monthKey]) || {};
                const mGrid = (monthlyGridData && monthlyGridData[monthKey]) || {};

                PRODUCTS.forEach(p => {
                    mBudget += Number(mBudgets[p]) || 0;
                    const g = mGoals[p] || {};
                    mCpqGoal += Number(g.cpq) || 0;
                    mMatriculadosGoal += Number(g.matriculados) || 0;

                    const prodGrid = mGrid[p] || {};
                    Object.values(prodGrid).forEach(d => {
                        mCpq += Number(d?.cpqVal) || 0;
                        mMatriculados += Number(d?.matriculadosVal) || 0;
                    });
                });

                (campaigns || []).forEach(c => {
                    const monthDaily = c?.dailyData?.[monthKey];
                    if (monthDaily && typeof monthDaily === 'object') {
                        Object.values(monthDaily).forEach(d => {
                            mSpent += Number(d?.realized) || 0;
                        });
                    }
                });

                const cpqCost = mCpq > 0 ? mSpent / mCpq : 0;
                const cpaCost = mMatriculados > 0 ? mSpent / mMatriculados : 0;
                const targetCpqCost = mCpqGoal > 0 ? mBudget / mCpqGoal : 0;
                const targetCpaCost = mMatriculadosGoal > 0 ? mBudget / mMatriculadosGoal : 0;

                return { mBudget, mSpent, mCpq, mMatriculados, mCpqGoal, mMatriculadosGoal, cpqCost, cpaCost, targetCpqCost, targetCpaCost };
            };

            const handleExportCSV = () => {
                let csv = "Tipo,Mes,Produto,Ferramenta,Valor\n";
                Object.keys(budgetsByMonth || {}).forEach(m => {
                    PRODUCTS.forEach(p => csv += `Orcamento,${m},${p},Geral,${budgetsByMonth[m]?.[p] || 0}\n`);
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_protegido_orcamentos_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            };

            const handleOpenAI = () => {
                setIsAiModalOpen(true);
                setAiText("A analisar métricas de performance, pacing dinâmico e projeção de fim de mês com Inteligência Artificial...");
                setTimeout(() => {
                    const pastDays = (pacingRows || []).filter(r => r.isPast).length || 1;
                    const totalDays = (pacingRows || []).length || 30;
                    
                    const globalRunRateSpent = (currentKPIs.globalRealized / pastDays) * totalDays;
                    const runRateSpentFiltered = (currentKPIs.totalRealized / pastDays) * totalDays;
                    const runRateCpq = (currentKPIs.totalCpq / pastDays) * totalDays;
                    const runRateMat = (currentKPIs.totalMatriculados / pastDays) * totalDays;

                    let aiMessage = `🤖 Projeção Inteligente de Fechamento de Mês (${selectedProduct} - ${selectedMonth}):\n\n`;
                    aiMessage += `- Orçamento Disponível (Global): ${formatBRL(currentKPIs.budget)}\n`;
                    aiMessage += `- Consumo Projetado Global (Run-Rate): ${formatBRL(globalRunRateSpent)}\n`;
                    aiMessage += `- CPQ Projetado: ${formatNum(runRateCpq)} (Meta Global: ${formatNum(currentKPIs.cpqGoal)})\n`;
                    aiMessage += `- Matriculados Digitais Projetados: ${formatNum(runRateMat)} (Meta Global: ${formatNum(currentKPIs.matriculadosGoal)})\n`;
                    aiMessage += `- CPQ Médio Projetado: ${formatBRL(runRateCpq > 0 ? runRateSpentFiltered / runRateCpq : 0)} (Meta: ${formatBRL(currentKPIs.targetCpqCost)})\n`;
                    aiMessage += `- CPA Médio Projetado: ${formatBRL(runRateMat > 0 ? runRateSpentFiltered / runRateMat : 0)} (Meta: ${formatBRL(currentKPIs.targetCpaCost)})\n\n`;
                    
                    aiMessage += `Recomendação da IA: O pacing dinâmico recalculou a meta diária restante para ${formatBRL(currentKPIs.suggestedPacing)} de forma a absorver eventuais déficits ou sobras dos dias anteriores.`;

                    setAiText(aiMessage);
                }, 1000);
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl border border-slate-700">
                            <div className="text-center mb-6">
                                <div className="inline-flex p-3 bg-unicesumar text-white rounded-2xl shadow-md mb-3">
                                    <Icon name="lock" className="w-8 h-8" />
                                </div>
                                <h1 className="text-2xl font-bold text-slate-900">UniCesumar</h1>
                                <p className="text-xs text-slate-500 mt-1">Gestão de Mídia Performance & Pacing</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuário / Login</label>
                                    <input 
                                        type="text" 
                                        value={loginUser}
                                        onChange={(e) => setLoginUser(e.target.value)}
                                        placeholder="Digite seu login"
                                        required
                                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-sm focus:outline-none focus:border-blue-700"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha</label>
                                    <input 
                                        type="password" 
                                        value={loginPass}
                                        onChange={(e) => setLoginPass(e.target.value)}
                                        placeholder="Digite sua senha"
                                        required
                                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-sm focus:outline-none focus:border-blue-700"
                                    />
                                </div>

                                {loginError && (
                                    <div className="bg-red-50 text-red-600 text-xs p-3 rounded-lg border border-red-200 text-center font-medium">
                                        {loginError}
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    className="w-full bg-unicesumar hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition shadow-lg mt-2"
                                >
                                    Entrar no Sistema
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-[98rem] mx-auto px-4 py-6">
                    <div className="bg-unicesumar text-white rounded-2xl p-5 shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <div className="flex items-center gap-2">
                                <h1 className="text-xl font-bold tracking-wide">UniCesumar</h1>
                                <span className={`text-[10px] font-semibold px-2.5 py-0.5 rounded-full ${isReadOnly ? 'bg-amber-500/20 text-amber-300 border border-amber-400/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30'}`}>
                                    {currentUser.name} ({isReadOnly ? 'Somente Leitura' : 'Editor'})
                                </span>
                            </div>
                            <p className="text-xs text-blue-200">Gestão de Mídia Performance & Pacing</p>
                        </div>

                        <div className="flex items-center gap-3 bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/20">
                            <Icon name="calendar" className="w-5 h-5 text-blue-300" />
                            <div>
                                <label className="block text-[10px] uppercase tracking-wider text-blue-200 font-semibold">Mês de Referência</label>
                                <select 
                                    value={selectedMonth}
                                    onChange={(e) => setSelectedMonth(e.target.value)}
                                    className="bg-transparent font-bold text-white text-sm focus:outline-none cursor-pointer"
                                >
                                    {MONTHS_LIST.map(m => (
                                        <option key={m.id} value={m.id} className="text-slate-900">{m.name}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2.5">
                            <button onClick={handleOpenAI} className="flex items-center gap-1.5 bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow transition">
                                <Icon name="sparkles" className="w-4 h-4" /> Projeção IA
                            </button>
                            <button onClick={() => setIsShareModalOpen(true)} className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow transition">
                                <Icon name="share" className="w-4 h-4" /> Partilhar
                            </button>
                            <button onClick={handleLogout} className="flex items-center gap-1.5 bg-red-600/80 hover:bg-red-600 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow transition">
                                Sair
                            </button>
                        </div>
                    </div>

                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">
                                Painel de Rateio Inteligente & Pacing Dinâmico
                            </h2>
                            <p className="text-slate-500 text-sm mt-0.5">Upload universal de CSV com rateio automático e pacing vivo por produto</p>
                        </div>
                        <div className="flex gap-2 items-center">
                            {!isReadOnly && (
                                <label className="flex items-center gap-2 bg-blue-700 hover:bg-blue-800 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer">
                                    <Icon name="download" className="w-4 h-4 rotate-180" /> Subir Planilha(s) de Consumo (.csv)
                                    <input type="file" accept=".csv" multiple onChange={handleUniversalCSVUpload} className="hidden" />
                                </label>
                            )}
                            <button onClick={handleExportCSV} className="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-lg text-xs font-semibold border border-slate-300 shadow-sm transition">
                                <Icon name="download" className="w-4 h-4" /> Backup CSV Protegido
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-wrap items-center justify-between gap-2 mb-6 bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                        <div className="flex flex-wrap items-center gap-2">
                            <button
                                onClick={() => setActiveTab("overview")}
                                className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === "overview" ? 'bg-unicesumar text-white shadow' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                            >
                                📊 Visão Geral & Gráficos
                            </button>
                            {PRODUCTS.map(prod => (
                                <button
                                    key={prod}
                                    onClick={() => { setSelectedProduct(prod); setActiveTab("pacing"); }}
                                    className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${activeTab !== "overview" && activeTab !== "comparison" && activeTab !== "mapping" && selectedProduct === prod ? 'bg-blue-700 text-white shadow' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                                >
                                    {prod}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <button
                                onClick={() => setActiveTab("mapping")}
                                className={`px-3.5 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-1.5 ${activeTab === "mapping" ? 'bg-purple-700 text-white shadow' : 'bg-purple-50 text-purple-800 border border-purple-200 hover:bg-purple-100'}`}
                            >
                                <Icon name="settings" className="w-4 h-4" /> Mapeamento
                            </button>
                            <button
                                onClick={() => setActiveTab("comparison")}
                                className={`px-3.5 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-1.5 ${activeTab === "comparison" ? 'bg-emerald-700 text-white shadow' : 'bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100'}`}
                            >
                                <Icon name="git-compare" className="w-4 h-4" /> Comparativo Meses
                            </button>
                        </div>
                    </div>

                    {activeTab !== "comparison" && activeTab !== "overview" && activeTab !== "mapping" && (
                        <div className="flex justify-between items-center mb-6 bg-white px-4 py-3 rounded-xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Canal:</span>
                                {["Todas", "Google Ads", "Meta Ads"].map(tool => (
                                    <button
                                        key={tool}
                                        onClick={() => setSelectedTool(tool)}
                                        className={`px-3 py-1 rounded-md text-xs font-medium transition ${selectedTool === tool ? 'bg-unicesumar text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        {tool}
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab("pacing")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'pacing' ? 'bg-blue-50 text-blue-800 border border-blue-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    📅 Pacing Dinâmico & Metas
                                </button>
                                <button onClick={() => setActiveTab("campaigns")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'campaigns' ? 'bg-blue-50 text-blue-800 border border-blue-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    🚀 Campanhas
                                </button>
                                <button onClick={() => setActiveTab("reports")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'reports' ? 'bg-blue-50 text-blue-800 border border-blue-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    📈 Relatórios & Gráficos
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === "mapping" && (
                        <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
                                <div>
                                    <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        <Icon name="settings" className="text-purple-700" /> Gestão de Rateio & Novas Campanhas
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">Adicione novas campanhas e defina em qual produto o investimento será rateado automaticamente ao subir os CSVs.</p>
                                </div>
                            </div>

                            {!isReadOnly && (
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newMapCampName.trim()) return;
                                    const updatedMap = { ...campaignMap, [newMapCampName.trim()]: newMapProduct };
                                    saveDataToCloud(budgetsByMonth, goalsByMonth, monthlyGridData, campaigns, updatedMap);
                                    setNewMapCampName("");
                                    alert("Nova campanha mapeada com sucesso!");
                                }} className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome exato da Campanha</label>
                                        <input 
                                            type="text" 
                                            value={newMapCampName}
                                            onChange={(e) => setNewMapCampName(e.target.value)}
                                            placeholder="Ex: U-EAD-GG-ONG-CAP-POS-..."
                                            required
                                            className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Produto Destino (Rateio)</label>
                                        <select 
                                            value={newMapProduct}
                                            onChange={(e) => setNewMapProduct(e.target.value)}
                                            className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-semibold"
                                        >
                                            {PRODUCTS.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    <button type="submit" className="bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2 px-4 rounded-lg text-sm transition shadow">
                                        + Adicionar Regra de Mapeamento
                                    </button>
                                </form>
                            )}

                            <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left text-sm text-slate-700">
                                    <thead className="bg-slate-100 text-slate-600 uppercase text-xs border-b border-slate-200">
                                        <tr>
                                            <th className="px-4 py-3">Nome da Campanha</th>
                                            <th className="px-4 py-3">Produto Atribuído (Rateio)</th>
                                            {!isReadOnly && <th className="px-4 py-3 text-right">Remover</th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {Object.entries(campaignMap).map(([cName, prod]) => (
                                            <tr key={cName} className="hover:bg-slate-50">
                                                <td className="px-4 py-3 font-medium text-slate-900">{cName}</td>
                                                <td className="px-4 py-3">
                                                    <span className="px-2.5 py-1 bg-blue-50 text-blue-800 rounded-md text-xs font-semibold border border-blue-200">
                                                        {prod}
                                                    </span>
                                                </td>
                                                {!isReadOnly && (
                                                    <td className="px-4 py-3 text-right">
                                                        <button 
                                                            onClick={() => {
                                                                const copy = { ...campaignMap };
                                                                delete copy[cName];
                                                                saveDataToCloud(budgetsByMonth, goalsByMonth, monthlyGridData, campaigns, copy);
                                                            }}
                                                            className="text-red-500 hover:text-red-700 p-1"
                                                        >
                                                            <Icon name="trash" className="w-4 h-4" />
                                                        </button>
                                                    </td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === "overview" && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Orçamento Total Global</span>
                                    <p className="text-2xl font-bold text-slate-900 mt-2">{formatBRL(overviewGlobalStats.totalBudget)}</p>
                                    <p className="text-xs text-slate-500 mt-1">Soma de todos os produtos</p>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Consumo Realizado Total</span>
                                    <p className="text-2xl font-bold text-blue-700 mt-2">{formatBRL(overviewGlobalStats.totalSpent)}</p>
                                    <div className="flex items-center gap-2 mt-1">
                                        <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                            <div className="bg-blue-600 h-full rounded-full" style={{ width: `${overviewGlobalStats.totalPct}%` }}></div>
                                        </div>
                                        <span className="text-xs font-bold text-slate-600">{overviewGlobalStats.totalPct}%</span>
                                    </div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">CPQ Globais (Real/Meta)</span>
                                    <p className="text-2xl font-bold text-slate-900 mt-2">{formatNum(overviewGlobalStats.totalCpq)} <span className="text-xs text-slate-400 font-normal">/ {formatNum(overviewGlobalStats.totalCpqGoal)}</span></p>
                                    <p className="text-xs text-blue-600 font-semibold mt-1">Atingimento: {overviewGlobalStats.cpqPct}% (CPQ: {formatBRL(overviewGlobalStats.avgCpqCost)})</p>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Matriculados Digitais (Real/Meta)</span>
                                    <p className="text-2xl font-bold text-slate-900 mt-2">{formatNum(overviewGlobalStats.totalMatriculados)} <span className="text-xs text-slate-400 font-normal">/ {formatNum(overviewGlobalStats.totalMatriculadosGoal)}</span></p>
                                    <p className="text-xs text-emerald-600 font-semibold mt-1">Atingimento: {overviewGlobalStats.matriculadosPct}% (CPA: {formatBRL(overviewGlobalStats.avgCpaCost)})</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                                    <h3 className="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                                        <Icon name="pie-chart" className="text-blue-700" /> Consumo vs Orçamento por Produto
                                    </h3>
                                    <div className="space-y-3">
                                        {PRODUCTS.map(prod => {
                                            const b = currentMonthBudgets[prod] || 0;
                                            const spent = totalSpentByProduct[prod] || 0;
                                            const pct = b > 0 ? Math.min(Math.round((spent / b) * 100), 100) : 0;
                                            return (
                                                <div key={prod} className="text-xs">
                                                    <div className="flex justify-between font-semibold text-slate-700 mb-1">
                                                        <span>{prod}</span>
                                                        <span>{formatBRL(spent)} / {formatBRL(b)} ({pct}%)</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                                        <div className={`h-full rounded-full ${pct > 100 ? 'bg-red-500' : 'bg-blue-600'}`} style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                                    <h3 className="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                                        <Icon name="trending" className="text-emerald-700" /> Atingimento de Metas (Matriculados)
                                    </h3>
                                    <div className="space-y-3">
                                        {PRODUCTS.map(prod => {
                                            const goalObj = (goalsByMonth && goalsByMonth[selectedMonth] && goalsByMonth[selectedMonth][prod]) || { matriculados: 0 };
                                            const goalMat = goalObj.matriculados || 1;
                                            let realMat = 0;
                                            const prodGrid = (monthlyGridData && monthlyGridData[selectedMonth] && monthlyGridData[selectedMonth][prod]) || {};
                                            Object.values(prodGrid).forEach(d => {
                                                realMat += Number(d?.matriculadosVal) || 0;
                                            });
                                            const pctMat = Math.min(Math.round((realMat / goalMat) * 100), 100);
                                            return (
                                                <div key={prod} className="text-xs">
                                                    <div className="flex justify-between font-semibold text-slate-700 mb-1">
                                                        <span>{prod}</span>
                                                        <span>{formatNum(realMat)} / {formatNum(goalMat)} mat. ({pctMat}%)</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                                        <div className="h-full rounded-full bg-emerald-500" style={{ width: `${pctMat}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm p-5">
                                <h3 className="text-lg font-bold text-slate-900 mb-4">Desempenho Consolidado por Produto</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm text-slate-700">
                                        <thead className="bg-slate-100 text-slate-600 uppercase text-xs border-b border-slate-200">
                                            <tr>
                                                <th className="px-4 py-3">Produto</th>
                                                <th className="px-4 py-3">Orçamento BAU</th>
                                                <th className="px-4 py-3">Consumo Realizado</th>
                                                <th className="px-4 py-3">CPQ (Real / Meta)</th>
                                                <th className="px-4 py-3 text-amber-700 font-bold">CPQ (R$)</th>
                                                <th className="px-4 py-3">Matriculados (Real / Meta)</th>
                                                <th className="px-4 py-3 text-purple-700 font-bold">CPA (R$)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {PRODUCTS.map(prod => {
                                                const budget = Number(currentMonthBudgets[prod]) || 0;
                                                const spent = totalSpentByProduct[prod] || 0;
                                                const goalObj = (goalsByMonth && goalsByMonth[selectedMonth] && goalsByMonth[selectedMonth][prod]) || { cpq: 0, matriculados: 0 };
                                                
                                                let prodCpq = 0;
                                                let prodMatriculados = 0;
                                                const prodGrid = (monthlyGridData && monthlyGridData[selectedMonth] && monthlyGridData[selectedMonth][prod]) || {};
                                                Object.values(prodGrid).forEach(d => {
                                                    prodCpq += Number(d?.cpqVal) || 0;
                                                    prodMatriculados += Number(d?.matriculadosVal) || 0;
                                                });

                                                const cpqCost = prodCpq > 0 ? spent / prodCpq : 0;
                                                const cpaCost = prodMatriculados > 0 ? spent / prodMatriculados : 0;

                                                return (
                                                    <tr key={prod} className="hover:bg-slate-50">
                                                        <td className="px-4 py-3 font-semibold text-slate-900">{prod}</td>
                                                        <td className="px-4 py-3 font-medium">{formatBRL(budget)}</td>
                                                        <td className="px-4 py-3 font-semibold text-blue-700">{formatBRL(spent)}</td>
                                                        <td className="px-4 py-3">{formatNum(prodCpq)} / {formatNum(goalObj.cpq)}</td>
                                                        <td className="px-4 py-3 font-bold text-amber-700">{formatBRL(cpqCost)}</td>
                                                        <td className="px-4 py-3">{formatNum(prodMatriculados)} / {formatNum(goalObj.matriculados)}</td>
                                                        <td className="px-4 py-3 font-bold text-purple-700">{formatBRL(cpaCost)}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === "comparison" && (
                        <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
                            <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2.5">
                                <div className="p-2 bg-emerald-50 rounded-xl text-emerald-700">
                                    <Icon name="git-compare" className="w-5 h-5" />
                                </div>
                                Comparativo Avançado entre Meses (Orçamento, Metas, CPQ & CPA)
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Mês A (Base)</label>
                                    <select value={compareMonthA} onChange={(e) => setCompareMonthA(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-900 font-semibold">
                                        {MONTHS_LIST.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Mês B (Comparação)</label>
                                    <select value={compareMonthB} onChange={(e) => setCompareMonthB(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-900 font-semibold">
                                        {MONTHS_LIST.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            {(() => {
                                const statsA = getMonthStatsForComparison(compareMonthA);
                                const statsB = getMonthStatsForComparison(compareMonthB);
                                return (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3">
                                            <h3 className="text-xs font-semibold text-slate-500 uppercase">Orçamento & Gasto</h3>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-500">Orçamento A:</span>
                                                <span className="font-bold">{formatBRL(statsA.mBudget)}</span>
                                            </div>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-500">Orçamento B:</span>
                                                <span className="font-bold text-blue-700">{formatBRL(statsB.mBudget)}</span>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3">
                                            <h3 className="text-xs font-semibold text-slate-500 uppercase">CPQ & Custo CPQ</h3>
                                            <div className="flex justify-between text-sm">
